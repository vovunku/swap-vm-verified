<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwapVM — verified programs</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c222b; --line:#2a323d;
  --fg:#e6edf3; --dim:#8b98a5; --acc:#4a9eff; --ok:#3fb950; --err:#f85149; --warn:#d29922;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f8fa; --panel:#fff; --panel2:#f0f3f6; --line:#d8dee4;
         --fg:#1f2328; --dim:#59636e; --acc:#0969da; --ok:#1a7f37; --err:#cf222e; --warn:#9a6700; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
header{padding:22px 26px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:19px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13px;margin-top:5px}
.wrap{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 84px)}
@media (max-width:900px){ .wrap{grid-template-columns:1fr} nav{border-right:0!important;
  border-bottom:1px solid var(--line);max-height:none!important} }
nav{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;
  max-height:calc(100vh - 84px);padding:10px 0}
nav h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
  margin:16px 16px 7px;font-weight:600}
.item{padding:9px 16px;cursor:pointer;border-left:3px solid transparent;font-size:14px}
.item:hover{background:var(--panel2)}
.item.on{background:var(--panel2);border-left-color:var(--acc)}
.item .t{font-weight:500}
.item .d{color:var(--dim);font-size:12px;margin-top:2px}
.pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;
  border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:1px}
.pill.good{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--err);border-color:var(--err)}
main{padding:26px 30px;max-width:900px}
h3{font-size:16px;margin:0 0 6px}
.note{color:var(--dim);font-size:14px;margin-bottom:20px}
section{margin-bottom:26px}
section>h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
  margin:0 0 10px;font-weight:600}
.step{display:flex;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);margin-bottom:6px;align-items:baseline}
.step .pc{color:var(--dim);font-size:12px;min-width:42px}
.step .op{color:var(--acc);font-weight:600;font-size:13px;min-width:150px}
.step .ar{color:var(--dim);font-size:12px;word-break:break-all;flex:1}
.step.dead{border-color:var(--err)}
.bytes{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px;
  font-size:12px;word-break:break-all;color:var(--dim);overflow-x:auto}
.v{border:1px solid var(--line);border-left-width:3px;border-radius:7px;background:var(--panel);
  padding:12px 14px;margin-bottom:9px}
.v.yes{border-left-color:var(--ok)} .v.err{border-left-color:var(--err)}
.v.no{border-left-color:var(--line)} .v.info{border-left-color:var(--acc)}
.v.warnb{border-left-color:var(--warn)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:4px;margin-right:9px;background:var(--panel2);color:var(--dim)}
.tag.yes{color:var(--ok)} .tag.err{color:var(--err)} .tag.info{color:var(--acc)}
.tag.warnb{color:var(--warn)}
.v .plain{margin-top:7px;font-size:14px}
.v .why{margin-top:7px;font-size:13px;color:var(--dim)}
.src{margin-top:9px;font-size:11.5px;color:var(--dim);font-family:ui-monospace,monospace}
details{margin-top:8px} summary{cursor:pointer;font-size:12.5px;color:var(--dim)}
details ul{margin:7px 0 0 0;padding-left:19px;font-size:13px;color:var(--dim)}
.replay{font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;
  padding:8px 11px;margin-bottom:11px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin-top:8px}
.kv .k{color:var(--dim)}
.gate{display:flex;gap:8px;margin-bottom:10px}
.gate button{font:inherit;font-size:12.5px;padding:5px 12px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--dim)}
.gate button.on{border-color:var(--acc);color:var(--acc);background:var(--panel2)}
.srchdr{font-size:12.5px;color:var(--dim);margin-bottom:8px}
.srcbox{border:1px solid var(--line);border-radius:7px;background:var(--panel);margin-bottom:7px}
.srcbox>summary{padding:9px 13px;font-size:12.5px;color:var(--acc);
  font-family:ui-monospace,monospace;list-style:none}
.srcbox>summary::-webkit-details-marker{display:none}
.srcbox>summary::before{content:"▸ ";color:var(--dim)}
.srcbox[open]>summary::before{content:"▾ "}
.srcbox[open]>summary{border-bottom:1px solid var(--line)}
.srcbox pre{margin:0;padding:13px;overflow-x:auto;font-size:12px;line-height:1.5;
  background:var(--panel2);white-space:pre}
.srcbody{padding:0}
.about{padding:11px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.about b{font-size:12.5px}
.dimmono{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--dim)}
.natspec{margin-top:8px;color:var(--dim);font-size:12.5px;line-height:1.6;
  white-space:pre-wrap;max-height:230px;overflow-y:auto}
.lead{padding:10px 13px;font-size:12.5px;color:var(--dim);border-bottom:1px solid var(--line)}
.innerbox{border-top:1px solid var(--line)}
.innerbox>summary{padding:9px 13px;font-size:12px;color:var(--dim);
  font-family:ui-monospace,monospace;list-style:none}
.innerbox>summary::-webkit-details-marker{display:none}
.innerbox>summary::before{content:"▸ "}
.innerbox[open]>summary::before{content:"▾ "}
.innerbox[open]>summary{border-bottom:1px solid var(--line)}
.innerbox pre{max-height:520px;overflow-y:auto}
footer{padding:20px 30px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;
  background:var(--panel)}
footer code{background:var(--panel2);padding:1px 5px;border-radius:4px}
a{color:var(--acc)}
</style></head><body>

"top": false, "verdict": "failed as required"}, "ok": true, "recorded": true, "spec": {"available": true, "exit": 0, "expected": "#Top", "seconds": 5.1, "spec": "pricing-spec", "stuck": false, "top": true, "verdict": "PROVED"}}, "exec": {"0": {"GATE": "0x00000000000000000000000000000000000000AA", "available": true, "config": {"gateBalance": 0}, "error": "TakerTokenBalanceIsZero(address taker, address token)", "raw": [], "recorded": true, "selector": "9669f955", "status": "reverted"}, "5": {"GATE": "0x00000000000000000000000000000000000000AA", "amountIn": "1000000000000000000", "amountOut": "2000000000000000000", "available": true, "balanceIn": "1000000000000000000000", "balanceOut": "2000000000000000000000", "config": {"gateBalance": 5}, "nextPC": "91", "raw": [], "recorded": true, "status": "completed"}}, "expect": {"pc": 91, "status": "Running", "amountOut": null}, "sources": {"src/instructions/Controls.sol::_onlyTakerTokenBalanceNonZero": {"kind": "solidity", "path": "src/instructions/Controls.sol", "fn": "_onlyTakerTokenBalanceNonZero", "opcode": "23", "text": "    /// @dev Checks if the taker holds any amount of the specified token (NFTs are natively supported)\n    /// @dev Since EIP-7702, user may delegate it's account to certain code, potentially sharing authorization\n    ///   given even by soulbound NFT with other users\n    /// @param args.token | 20 bytes\n    function _onlyTakerTokenBalanceNonZero(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        require(balance > 0, TakerTokenBalanceIsZero(ctx.query.taker, token));\n    }", "full": "// SPDX-License-Identifier: LicenseRef-Degensoft-SwapVM-1.1\npragma solidity 0.8.30;\n\n/// @custom:license-url https://github.com/1inch/swap-vm/blob/main/LICENSES/SwapVM-1.1.txt\n/// @custom:copyright \u00a9 2025 Degensoft Ltd\n\nimport { IERC20 } from \"@openzeppelin/contracts/token/ERC20/IERC20.sol\";\n\nimport { Calldata } from \"@1inch/solidity-utils/contracts/libraries/Calldata.sol\";\nimport { Context, ContextLib } from \"../libs/VM.sol\";\n\nlibrary ControlsArgsBuilder {\n    function buildSalt(uint64 salt) internal pure returns (bytes memory) {\n        return abi.encodePacked(salt);\n    }\n\n    function buildSalt(bytes memory salt) internal pure returns (bytes memory) {\n        return salt;\n    }\n\n    function buildRevert(bytes4 exception) internal pure returns (bytes memory) {\n        return abi.encodePacked(exception);\n    }\n\n    function buildRevert(bytes memory exception) internal pure returns (bytes memory) {\n        return exception;\n    }\n\n    function buildJump(uint16 nextPC) internal pure returns (bytes memory) {\n        return abi.encodePacked(nextPC);\n    }\n\n    function buildJumpIfDirection(address tokenIn, address tokenOut, uint16 nextPC) internal pure returns (bytes memory) {\n        return abi.encodePacked(tokenIn < tokenOut, nextPC);\n    }\n\n    function buildJumpIfToken(address token, uint16 nextPC) internal pure returns (bytes memory) {\n        return abi.encodePacked(token, nextPC);\n    }\n\n    function buildDeadline(uint40 deadline) internal pure returns (bytes memory) {\n        return abi.encodePacked(deadline);\n    }\n\n    function buildTokenBalanceNonZero(address token) internal pure returns (bytes memory) {\n        return abi.encodePacked(token);\n    }\n\n    function buildTakerTokenBalanceGte(address token, uint256 minAmount) internal pure returns (bytes memory) {\n        return abi.encodePacked(token, minAmount);\n    }\n\n    function buildTakerTokenSupplyShareGte(address token, uint64 minShareE18) internal pure returns (bytes memory) {\n        return abi.encodePacked(token, minShareE18);\n    }\n}\n\n/// @title Controls\n/// @dev A set of functions for executing hooks in the SwapVM protocol\n/// It manages the program counter and executes hooks based on the current state\ncontract Controls {\n    using Calldata for bytes;\n    using ContextLib for Context;\n\n    error InstructionRevert(bytes);\n    error DeadlineReached(address taker, uint256 deadline);\n    error TakerTokenBalanceIsZero(address taker, address token);\n    error TxOriginTokenBalanceIsZero(address txOrigin, address token);\n    error TakerTokenBalanceIsLessThanRequired(address taker, address token, uint256 balance, uint256 minAmount);\n    error TakerTokenBalanceSupplyShareIsLessThanRequired(address taker, address token, uint256 balance, uint256 totalSupply, uint256 minShareE18);\n\n    /// @dev This instruction does nothing and can be used for uniqueness order hash value.\n    function _salt(Context memory /* ctx */, bytes calldata /* args */) internal pure { }\n\n    /// @dev Unconditional jump to the specified program counter\n    /// @dev LIMITATION: Jump targets are limited to uint16 (0-65,535) due to 2-byte encoding.\n    ///      For jumps to positions >= 65,536, use Extruction with custom control flow logic.\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jump(Context memory ctx, bytes calldata args) internal pure {\n        uint256 nextPC = uint16(bytes2(args));\n        ctx.setNextPC(nextPC);\n    }\n\n    /// @dev Unconditional revert with specified reason encoded\n    function _revert(Context memory, bytes calldata args) internal pure {\n        revert InstructionRevert(args);\n    }\n\n    /// @dev Unconditional succesful execution stop\n    function _stop(Context memory ctx, bytes calldata) internal pure {\n        // VM has nothing to execute out of program bounds\n        ctx.setNextPC(type(uint256).max);\n    }\n\n    /// @dev Jumps if swap direction matches the expected one\n    function _jumpIfDirection(Context memory ctx, bytes calldata args) internal pure {\n        bool expectedDirection = bytes1(args) != 0;\n        bool swapDirection = ctx.query.tokenIn < ctx.query.tokenOut;\n        if (expectedDirection == swapDirection) {\n            uint256 nextPC = uint16(bytes2(args.slice(1)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Jumps if tokenIn is the specified token\n    /// @dev LIMITATION: Jump targets limited to uint16 (0-65,535). See _jump for details.\n    /// @param args.token  | 20 bytes\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jumpIfTokenIn(Context memory ctx, bytes calldata args) internal pure {\n        address token = address(bytes20(args));\n        if (token == ctx.query.tokenIn) {\n            uint256 nextPC = uint16(bytes2(args.slice(20)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Jumps if tokenOut is the specified token\n    /// @dev LIMITATION: Jump targets limited to uint16 (0-65,535). See _jump for details.\n    /// @param args.token  | 20 bytes\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jumpIfTokenOut(Context memory ctx, bytes calldata args) internal pure {\n        address token = address(bytes20(args));\n        if (token == ctx.query.tokenOut) {\n            uint256 nextPC = uint16(bytes2(args.slice(20)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Reverts if the deadline has been reached\n    /// @param args.deadline | 5 bytes\n    function _deadline(Context memory ctx, bytes calldata args) internal view {\n        uint256 deadline = uint40(bytes5(args));\n        require(block.timestamp <= deadline, DeadlineReached(ctx.query.taker, deadline));\n    }\n\n    /// @dev Checks if the taker holds any amount of the specified token (NFTs are natively supported)\n    /// @dev Since EIP-7702, user may delegate it's account to certain code, potentially sharing authorization\n    ///   given even by soulbound NFT with other users\n    /// @param args.token | 20 bytes\n    function _onlyTakerTokenBalanceNonZero(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        require(balance > 0, TakerTokenBalanceIsZero(ctx.query.taker, token));\n    }\n\n    /// @dev Checks if tx.origin holds any amount of the specified token (NFTs are natively supported)\n    /// @dev The opcode allows authorized user to fill the order through 3rd-party contracts\n    ///   Validations through tx.origin are considered weak due to possible transaction flow interception\n    ///   E.g. authorized user performs transaction to 3rd-party protocol with no order filling intention,\n    ///   the 3rd-party protocol may use the authorization to fill the order\n    /// @param args.token | 20 bytes\n    function _onlyTxOriginTokenBalanceNonZero(Context memory /* ctx */, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 balance = IERC20(token).balanceOf(tx.origin);\n        require(balance > 0, TxOriginTokenBalanceIsZero(tx.origin, token));\n    }\n\n    /// @dev Checks if the taker holds at least a certain amount of tokens\n    /// @param args.token     | 20 bytes\n    /// @param args.minAmount | 32 bytes\n    function _onlyTakerTokenBalanceGte(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 minAmount = uint256(bytes32(args.slice(20)));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        require(balance >= minAmount, TakerTokenBalanceIsLessThanRequired(ctx.query.taker, token, balance, minAmount));\n    }\n\n    /// @dev Checks if the taker holds at least a certain share of the total token supply\n    /// @param args.token       | 20 bytes\n    /// @param args.minShareE18 | 8 bytes\n    function _onlyTakerTokenSupplyShareGte(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 minShareE18 = uint64(bytes8(args.slice(20)));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        uint256 totalSupply = IERC20(token).totalSupply();\n        // balance * 1e18 / totalSupply >= minShareE18\n        require(totalSupply > 0 && balance * 1e18 >= minShareE18 * totalSupply, TakerTokenBalanceSupplyShareIsLessThanRequired(ctx.query.taker, token, balance, totalSupply, minShareE18));\n    }\n}\n", "full_lines": 180, "contract": {"kind": "contract", "name": "Controls", "doc": "@title Controls\n@dev A set of functions for executing hooks in the SwapVM protocol\nIt manages the program counter and executes hooks based on the current state", "handles": ["Deadline", "Jump", "JumpIfDirection", "JumpIfTokenIn", "JumpIfTokenOut", "OnlyTakerTokenBalanceGte", "OnlyTakerTokenBalanceNonZero", "OnlyTakerTokenSupplyShareGte", "OnlyTxOriginTokenBalanceNonZero", "Revert", "Salt", "Stop"]}}, "src/instructions/Balances.sol::_staticBalancesXD": {"kind": "solidity", "path": "src/instructions/Balances.sol", "fn": "_staticBalancesXD", "opcode": "90", "text": "    /// @dev Sets ctx.swap.balanceIn/Out from provided initial balances\n    /// @param args.initialBalances[2] | 32 bytes * 2\n    function _staticBalancesXD(Context memory ctx, bytes calldata args) internal pure {\n        require(ctx.swap.balanceIn == 0 && ctx.swap.balanceOut == 0, SetBalancesExpectZeroBalances(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        uint256 balanceIn;\n        uint256 balanceOut;\n        if (ctx.query.tokenIn < ctx.query.tokenOut) (balanceIn, balanceOut) = BalancesArgsBuilder.parse(args);\n        else (balanceOut, balanceIn) = BalancesArgsBuilder.parse(args);\n\n        ctx.swap.balanceIn = balanceIn;\n        ctx.swap.balanceOut = balanceOut;\n    }", "full": "// SPDX-License-Identifier: LicenseRef-Degensoft-SwapVM-1.1\npragma solidity 0.8.30;\n\n/// @custom:license-url https://github.com/1inch/swap-vm/blob/main/LICENSES/SwapVM-1.1.txt\n/// @custom:copyright \u00a9 2025 Degensoft Ltd\n\nimport { SafeCast } from \"@openzeppelin/contracts/utils/math/SafeCast.sol\";\n\nimport { Calldata } from \"@1inch/solidity-utils/contracts/libraries/Calldata.sol\";\nimport { Context, ContextLib } from \"../libs/VM.sol\";\n\nlibrary BalancesArgsBuilder {\n    using SafeCast for uint256;\n    using Calldata for bytes;\n\n    function build(uint256[2] memory balances) internal pure returns (bytes memory) {\n        return abi.encodePacked(balances[0], balances[1]);\n    }\n\n    function parse(bytes calldata args) internal pure returns (uint256 balanceA, uint256 balanceB) {\n        balanceA = uint256(bytes32(args));\n        balanceB = uint256(bytes32(args.slice(32)));\n    }\n}\n\ncontract Balances {\n    using Calldata for bytes;\n    using ContextLib for Context;\n\n    error SetBalancesExpectZeroBalances(uint256 balanceIn, uint256 balanceOut);\n\n    mapping(bytes32 orderHash =>\n        mapping(address token => uint256)) public balances;\n\n    /// @dev Sets ctx.swap.balanceIn/Out from provided initial balances\n    /// @param args.initialBalances[2] | 32 bytes * 2\n    function _staticBalancesXD(Context memory ctx, bytes calldata args) internal pure {\n        require(ctx.swap.balanceIn == 0 && ctx.swap.balanceOut == 0, SetBalancesExpectZeroBalances(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        uint256 balanceIn;\n        uint256 balanceOut;\n        if (ctx.query.tokenIn < ctx.query.tokenOut) (balanceIn, balanceOut) = BalancesArgsBuilder.parse(args);\n        else (balanceOut, balanceIn) = BalancesArgsBuilder.parse(args);\n\n        ctx.swap.balanceIn = balanceIn;\n        ctx.swap.balanceOut = balanceOut;\n    }\n\n    /// @dev Load or init ctx.swap.balanceIn/Out from provided initial balances,\n    ///      then execute sub-instruction and apply swap amounts to stored balances\n    /// @dev QUOTE/SWAP DIVERGENCE: In quote mode (isStaticContext=true), this instruction reads balances\n    ///   but does NOT update them after nested instructions complete. Quote may succeed while swap reverts\n    ///   if balances were modified between quote and swap calls. Makers MUST NOT use backward jumps to\n    ///   this instruction as it breaks numerical consistency between quote() and swap().\n    /// @param args.initialBalances[2] | 32 bytes * 2\n    function _dynamicBalancesXD(Context memory ctx, bytes calldata args) internal {\n        require(ctx.swap.balanceIn == 0 && ctx.swap.balanceOut == 0, SetBalancesExpectZeroBalances(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        uint256 balanceIn = balances[ctx.query.orderHash][ctx.query.tokenIn];\n        uint256 balanceOut = balances[ctx.query.orderHash][ctx.query.tokenOut];\n\n        if (balanceIn | balanceOut == 0) {\n            if (ctx.query.tokenIn < ctx.query.tokenOut) (balanceIn, balanceOut) = BalancesArgsBuilder.parse(args);\n            else (balanceOut, balanceIn) = BalancesArgsBuilder.parse(args);\n\n            if (!ctx.vm.isStaticContext) {\n                balances[ctx.query.orderHash][ctx.query.tokenIn] = balanceIn;\n                balances[ctx.query.orderHash][ctx.query.tokenOut] = balanceOut;\n            }\n        }\n\n        ctx.swap.balanceIn = balanceIn;\n        ctx.swap.balanceOut = balanceOut;\n\n        ctx.runLoop();\n\n        if (!ctx.vm.isStaticContext) {\n            balances[ctx.query.orderHash][ctx.query.tokenIn] += ctx.swap.amountIn;\n            balances[ctx.query.orderHash][ctx.query.tokenOut] -= ctx.swap.amountOut;\n        }\n    }\n}\n", "full_lines": 83, "contract": {"kind": "contract", "name": "Balances", "doc": "", "handles": ["DynamicBalances", "StaticBalances"]}}, "src/instructions/LimitSwap.sol::_limitSwap1D": {"kind": "solidity", "path": "src/instructions/LimitSwap.sol", "fn": "_limitSwap1D", "opcode": "53", "text": "    /// @param args.makerDirectionLt | 1 byte (boolean, true if tokenIn < tokenOut)\n    function _limitSwap1D(Context memory ctx, bytes calldata args) internal pure {\n        require(ctx.swap.balanceIn > 0 && ctx.swap.balanceOut > 0, LimitSwapRequiresBothBalancesNonZero(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        bool makerDirectionLt = LimitSwapArgsBuilder.parse(args);\n        bool takerDirectionLt = ctx.query.tokenIn < ctx.query.tokenOut;\n        require(makerDirectionLt == takerDirectionLt, LimitSwapDirectionMismatch());\n\n        if (ctx.query.isExactIn) {\n            require(ctx.swap.amountOut == 0, LimitSwapRecomputeDetected());\n            ctx.swap.amountOut = ctx.swap.amountIn * ctx.swap.balanceOut / ctx.swap.balanceIn; // Floor division for tokenOut is desired behavior\n        } else {\n            require(ctx.swap.amountIn == 0, LimitSwapRecomputeDetected());\n            ctx.swap.amountIn = (ctx.swap.amountOut * ctx.swap.balanceIn).ceilDiv(ctx.swap.balanceOut); // Ceiling division for tokenIn is desired behavior\n        }\n    }", "full": "// SPDX-License-Identifier: LicenseRef-Degensoft-SwapVM-1.1\npragma solidity 0.8.30;\n\n/// @custom:license-url https://github.com/1inch/swap-vm/blob/main/LICENSES/SwapVM-1.1.txt\n/// @custom:copyright \u00a9 2025 Degensoft Ltd\n\nimport { Math } from \"@openzeppelin/contracts/utils/math/Math.sol\";\n\nimport { Calldata } from \"@1inch/solidity-utils/contracts/libraries/Calldata.sol\";\nimport { Context, ContextLib } from \"../libs/VM.sol\";\n\nlibrary LimitSwapArgsBuilder {\n    using Calldata for bytes;\n\n    /// @notice Build instruction arguments for LimitSwap\n    /// @param tokenIn Input token address\n    /// @param tokenOut Output token address\n    /// @return Packed bytes encoding swap direction (1 byte boolean: tokenIn < tokenOut)\n    function build(address tokenIn, address tokenOut) internal pure returns (bytes memory) {\n        return abi.encodePacked(tokenIn < tokenOut);\n    }\n\n    function parse(bytes calldata args) internal pure returns (bool makerDirectionLt) {\n        makerDirectionLt = uint8(bytes1(args)) != 0;\n    }\n}\n\n/// @dev Use with Balances._setBalance() instruction to ensure both balances are non-zero before proceeding with swap.\ncontract LimitSwap {\n    using Math for uint256;\n    using ContextLib for Context;\n\n    error LimitSwapDirectionMismatch();\n    error LimitSwapRecomputeDetected();\n    error LimitSwapRequiresBothBalancesNonZero(uint256 balanceIn, uint256 balanceOut);\n    error LimitSwapFullyRequiresAmountInToMatchBalanceIn(uint256 amountIn, uint256 balanceIn);\n    error LimitSwapFullyRequiresAmountOutToMatchBalanceOut(uint256 amountOut, uint256 balanceOut);\n\n    /// @param args.makerDirectionLt | 1 byte (boolean, true if tokenIn < tokenOut)\n    function _limitSwap1D(Context memory ctx, bytes calldata args) internal pure {\n        require(ctx.swap.balanceIn > 0 && ctx.swap.balanceOut > 0, LimitSwapRequiresBothBalancesNonZero(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        bool makerDirectionLt = LimitSwapArgsBuilder.parse(args);\n        bool takerDirectionLt = ctx.query.tokenIn < ctx.query.tokenOut;\n        require(makerDirectionLt == takerDirectionLt, LimitSwapDirectionMismatch());\n\n        if (ctx.query.isExactIn) {\n            require(ctx.swap.amountOut == 0, LimitSwapRecomputeDetected());\n            ctx.swap.amountOut = ctx.swap.amountIn * ctx.swap.balanceOut / ctx.swap.balanceIn; // Floor division for tokenOut is desired behavior\n        } else {\n            require(ctx.swap.amountIn == 0, LimitSwapRecomputeDetected());\n            ctx.swap.amountIn = (ctx.swap.amountOut * ctx.swap.balanceIn).ceilDiv(ctx.swap.balanceOut); // Ceiling division for tokenIn is desired behavior\n        }\n    }\n\n    /// @param args.makerDirectionLt | 1 byte (boolean, true if tokenIn < tokenOut)\n    function _limitSwapOnlyFull1D(Context memory ctx, bytes calldata args) internal pure {\n        require(ctx.swap.balanceIn > 0 && ctx.swap.balanceOut > 0, LimitSwapRequiresBothBalancesNonZero(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        bool makerDirectionLt = LimitSwapArgsBuilder.parse(args);\n        bool takerDirectionLt = ctx.query.tokenIn < ctx.query.tokenOut;\n        require(makerDirectionLt == takerDirectionLt, LimitSwapDirectionMismatch());\n\n        if (ctx.query.isExactIn) {\n            require(ctx.swap.amountIn == ctx.swap.balanceIn, LimitSwapFullyRequiresAmountInToMatchBalanceIn(ctx.swap.amountIn, ctx.swap.balanceIn));\n            require(ctx.swap.amountOut == 0, LimitSwapRecomputeDetected());\n            ctx.swap.amountOut = ctx.swap.balanceOut;\n        } else {\n            require(ctx.swap.amountOut == ctx.swap.balanceOut, LimitSwapFullyRequiresAmountOutToMatchBalanceOut(ctx.swap.amountOut, ctx.swap.balanceOut));\n            require(ctx.swap.amountIn == 0, LimitSwapRecomputeDetected());\n            ctx.swap.amountIn = ctx.swap.balanceIn;\n        }\n    }\n}\n", "full_lines": 75, "contract": {"kind": "contract", "name": "LimitSwap", "doc": "@dev Use with Balances._setBalance() instruction to ensure both balances are non-zero before proceeding with swap.", "handles": ["LimitSwap", "LimitSwapFullAmount"]}}, "semantics/proofs/gate-spec.k": {"kind": "k", "path": "semantics/proofs/gate-spec.k", "text": "claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\" +Bytes Int2Bytes(20, G, BE) +Bytes TAIL </program>\n        <pc> 0 => 22 </pc>\n        <balanceIn> _ </balanceIn> <balanceOut> _ </balanceOut>\n        <amountIn> _ </amountIn> <amountOut> _ </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> _ </isExactIn>\n        <tokenIn> _ </tokenIn> <tokenOut> _ </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running => Reverted(\"TakerTokenBalanceIsZero\") </status>\n        <trace> _ </trace>\n    requires 0 <=Int G andBool G <Int (2 ^Int 160)\n     andBool #balanceOf(BALS, G, TAKER) ==Int 0\n     // NOT decorative -- do not delete. It excludes no Bytes value semantically, but the\n     // backend needs it: once `lengthBytes(B1 +Bytes B2)` rewrites the program length to\n     // `22 +Int lengthBytes(TAIL)`, there is no axiom making `lengthBytes` non-negative, so\n     // without this the prover takes the `PC >= length` termination branch and the proof\n     // gets stuck at <pc> 0. Verified by deleting it.\n     andBool lengthBytes(TAIL) >=Int 0", "full": "module GATE-SPEC\n  imports SWAPVM\n  imports SWAPVM-BYTES-LEMMAS\n\n  // Phase 1 go/no-go.\n  //\n  // For ANY program that begins with OnlyTakerTokenBalanceNonZero(G) -- with TAIL an\n  // arbitrary, symbolic byte string -- a taker holding zero balance of G ends reverted.\n  //\n  // TAIL is never decoded: #revert discards the continuation, so its contents cannot affect\n  // the conclusion and the proof must not case-split on it.\n  claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\" +Bytes Int2Bytes(20, G, BE) +Bytes TAIL </program>\n        <pc> 0 => 22 </pc>\n        <balanceIn> _ </balanceIn> <balanceOut> _ </balanceOut>\n        <amountIn> _ </amountIn> <amountOut> _ </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> _ </isExactIn>\n        <tokenIn> _ </tokenIn> <tokenOut> _ </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running => Reverted(\"TakerTokenBalanceIsZero\") </status>\n        <trace> _ </trace>\n    requires 0 <=Int G andBool G <Int (2 ^Int 160)\n     andBool #balanceOf(BALS, G, TAKER) ==Int 0\n     // NOT decorative -- do not delete. It excludes no Bytes value semantically, but the\n     // backend needs it: once `lengthBytes(B1 +Bytes B2)` rewrites the program length to\n     // `22 +Int lengthBytes(TAIL)`, there is no axiom making `lengthBytes` non-negative, so\n     // without this the prover takes the `PC >= length` termination branch and the proof\n     // gets stuck at <pc> 0. Verified by deleting it.\n     andBool lengthBytes(TAIL) >=Int 0\n\nendmodule\n", "full_lines": 35, "focused": true}, "semantics/proofs/pricing-spec.k": {"kind": "k", "path": "semantics/proofs/pricing-spec.k", "text": "claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\" +Bytes Int2Bytes(20, G, BE)\n          +Bytes b\"\\x90\\x40\" +Bytes Int2Bytes(32, BA, BE) +Bytes Int2Bytes(32, BB, BE)\n          +Bytes b\"\\x53\\x01\\x01\" </program>\n        <pc> 0 => 91 </pc>\n        <balanceIn> 0 => BA </balanceIn> <balanceOut> 0 => BB </balanceOut>\n        <amountIn> AIN </amountIn>\n        <amountOut> 0 => ?AOUT:Int </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> true </isExactIn>\n        <tokenIn> TIN </tokenIn> <tokenOut> TOUT </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running </status>\n        <trace> _ </trace>\n    requires 0 <=Int G andBool G <Int (2 ^Int 160)\n     andBool #balanceOf(BALS, G, TAKER) >Int 0        // gate passes\n     andBool TIN <Int TOUT                            // matches direction byte 0x01\n     andBool 0 <Int BA andBool BA <Int (2 ^Int 256)   // maker's reserves, non-zero\n     andBool 0 <Int BB andBool BB <Int (2 ^Int 256)\n     andBool 0 <=Int AIN andBool AIN <Int (2 ^Int 256)\n    ensures ?AOUT *Int BA <=Int AIN *Int BB\n    andBool ( ?AOUT +Int 1 ) *Int BA >Int AIN *Int BB", "full": "module PRICING-SPEC\n  imports SWAPVM\n  imports SWAPVM-BYTES-LEMMAS\n\n  // T1 -- exact-in prices at EXACTLY the floor of the maker's rate.\n  //\n  // Runs the whole 3-instruction program, not just the arithmetic: the claim is about what\n  // the VM does, not about what limitQuoteOut computes in isolation.\n  //\n  // Both bounds are required. The upper alone is satisfied by returning 0; the lower alone by\n  // returning something huge. Together they pin amountOut to floor(AIN * BOUT / BIN).\n  claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\" +Bytes Int2Bytes(20, G, BE)\n          +Bytes b\"\\x90\\x40\" +Bytes Int2Bytes(32, BA, BE) +Bytes Int2Bytes(32, BB, BE)\n          +Bytes b\"\\x53\\x01\\x01\" </program>\n        <pc> 0 => 91 </pc>\n        <balan ol TIN <Int TOUT                            // matches direction byte 0x01\n     andBool 0 <Int BA andBool BA <Int (2 ^Int 256)   // maker's reserves, non-zero\n     andBool 0 <Int BB andBool BB <Int (2 ^Int 256)\n     andBool 0 <Int AOUT andBool AOUT <Int (2 ^Int 256)\n    ensures ?AIN *Int BB >=Int AOUT *Int BA\n    andBool ( ?AIN -Int 1 ) *Int BB <Int AOUT *Int BA", "full": "// STATUS: PROVED. kprove returns #Top.\nmodule PRICING-EXACTOUT-SPEC\n  imports SWAPVM\n  imports SWAPVM-BYTES-LEMMAS\n\n  // T2 -- exact-out prices at EXACTLY the ceiling of the maker's rate.\n  //\n  // Mirror of T1 on the other leg. The two round in OPPOSITE directions and that is\n  // deliberate: both must favour the maker. LimitSwap.sol:52 documents the ceiling as\n  // intended, and like the floor it was unconstrained by anything but concrete cases.\n  //\n  // Runs the whole 3-instruction program, not just the arithmetic: the claim is about what\n  // the VM does, not about what limitQuoteOut computes in isolation.\n  //\n  // Both bounds are required. The upper alone is satisfied by returning 0; the lower alone by\n  // returning something huge. Together they pin amountOut to floor(AIN * BOUT / BIN).\n  claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\" +Bytes Int2Bytes(20, G, BE)\n          +Bytes b\"\\x90\\x40\" +Bytes Int2Bytes(32, BA, BE) +Bytes Int2Bytes(32, BB, BE)\n          +Bytes b\"\\x53\\x01\\x01\" </program>\n        <pc> 0 => 91 </pc>\n        <balanceIn> 0 => BA </balanceIn> <balanceOut> 0 => BB </balanceOut>\n        <amountIn> 0 => ?AIN:Int </amountIn>\n        <amountOut> AOUT </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> false </isExactIn>\n        <tokenIn> TIN </tokenIn> <tokenOut> TOUT </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running </status>\n        <trace> _ </trace>\n    requires 0 <=Int G andBool G <Int (2 ^Int 160)\n     andBool #balanceOf(BALS, G, TAKER) >Int 0        // gate passes\n     andBool TIN <Int TOUT                            // matches direction byte 0x01\n     andBool 0 <Int BA andBool BA <Int (2 ^Int 256)   // maker's reserves, non-zero\n     andBool 0 <Int BB andBool BB <Int (2 ^Int 256)\n     andBool 0 <Int AOUT andBool AOUT <Int (2 ^Int 256)\n    ensures ?AIN *Int BB >=Int AOUT *Int BA\n    andBool ( ?AIN -Int 1 ) *Int BB <Int AOUT *Int BA\n\nendmodule\n", "full_lines": 43, "focused": true}, "semantics/proofs/pricing-negative-control.k": {"kind": "k", "path": "semantics/proofs/pricing-negative-control.k", "text": "claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\" +Bytes Int2Bytes(20, G, BE)\n          +Bytes b\"\\x90\\x40\" +Bytes Int2Bytes(32, BA, BE) +Bytes Int2Bytes(32, BB, BE)\n          +Bytes b\"\\x53\\x01\\x01\" </program>\n        <pc> 0 => 91 </pc>\n        <balanceIn> 0 => BA </balanceIn> <balanceOut> 0 => BB </balanceOut>\n        <amountIn> AIN </amountIn>\n        <amountOut> 0 => ?AOUT:Int </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> true </isExactIn>\n        <tokenIn> TIN </tokenIn> <tokenOut> TOUT </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running </status>\n        <trace> _ </trace>\n    requires 0 <=Int G andBool G <Int (2 ^Int 160)\n     andBool #balanceOf(BALS, G, TAKER) >Int 0        // gate passes\n     andBool TIN <Int TOUT                            // matches direction byte 0x01\n     andBool 0 <Int BA andBool BA <Int (2 ^Int 256)   // maker's reserves, non-zero\n     andBool 0 <Int BB andBool BB <Int (2 ^Int 256)\n     andBool 0 <=Int AIN andBool AIN <Int (2 ^Int 256)\n    ensures ?AOUT *Int BA >Int AIN *Int BB\n    andBool ( ?AOUT +Int 1 ) *Int BA >Int AIN *Int BB", "full": "module PRICING-NEGATIVE-CONTROL\n  imports SWAPVM\n  imports SWAPVM-BYTES-LEMMAS\n\n  // DELIBERATELY FALSE. Must fail.\n  //\n  // The maker-safety bound with the inequality REVERSED: asserts the taker receives strictly\n  // MORE than the exact rate. Floor division cannot do that. Reaches the arithmetic, unlike\n  // the Phase 1 control that died before any instruction executed.\n  //\n  // Runs the whole 3-instruction program, not just the arithmetic: the claim is about what\n  // the VM does, not about what limitQuoteOut computes in isolation.\n  //\n  // Both bounds are required. The upper alone is satisfied by returning 0; the lower alone by\n  // returning something huge. Together they pin amountOut to floor(AIN * BOUT / BIN).\n  claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\" +Bytes Int2Bytes(20, G, BE)\n          +Bytes b\"\\x90\\x40\" +Bytes Int2Bytes(32, BA, BE) +Bytes Int2Bytes(32, BB, BE)\n          +Bytes b\"\\x53\\x01\\x01\" </program>\n        <pc> 0 => 91 </pc>\n        <balanceIn> 0 => BA </balanceIn> <balanceOut> 0 => BB </balanceOut>\n        <amountIn> AIN </amountIn>\n        <amountOut> 0 => ?AOUT:Int </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> true </isExactIn>\n        <tokenIn> TIN </tokenIn> <tokenOut> TOUT </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running </status>\n        <trace> _ </trace>\n    requires 0 <=Int G andBool G <Int (2 ^Int 160)\n     andBool #balanceOf(BALS, G, TAKER) >Int 0        // gate passes\n     andBool TIN <Int TOUT                            // matches direction byte 0x01\n     andBool 0 <Int BA andBool BA <Int (2 ^Int 256)   // maker's reserves, non-zero\n     andBool 0 <Int BB andBool BB <Int (2 ^Int 256)\n     andBool 0 <=Int AIN andBool AIN <Int (2 ^Int 256)\n    ensures ?AOUT *Int BA >Int AIN *Int BB\n    andBool ( ?AOUT +Int 1 ) *Int BA >Int AIN *Int BB\n\nendmodule\n", "full_lines": 42, "focused": true}}}, {"label": "__bad", "title": "The same order, one byte wrong", "note": "The gate declares 19 argument bytes instead of 20. Nothing rejects that: a short value is zero-padded rather than refused, so the gate silently re-points from 0x\u2026AA to 0x\u202690 \u2014 it absorbed the next opcode byte. T0 stops applying. Run it and the real VM reverts, because the rest of the program is now misaligned too; the K model instead no-ops past it. That gap between \"reverts\" and \"quietly continues\" is the defect class recorded in commit 129aa48.", "kind": "bad", "bytes": "231300000000000000000000000000000000000000904000000000000000000000000000000000000000000000003635c9adc5dea0000000000000000000000000000000000000000000000000006c6b935b8bbd400000530101", "length": 90, "steps": [{"pc": 0, "op": "23", "name": "OnlyTakerTokenBalanceNonZero", "argsLen": 19, "args": "00000000000000000000000000000000000000", "modelled": true}, {"pc": 21, "op": "90", "name": "StaticBalances", "argsLen": 64, "args": "00000000000000000000000000000000000000000000003635c9adc5dea0000000000000000000000000000000000000000000000000006c6b935b8bbd400000", "modelled": true}, {"pc": 87, "op": "53", "name": "LimitSwap", "argsLen": 1, "args": "01", "modelled": true}], "applicable": [{"id": "T0", "file": "semantics/proofs/gate-spec.k", "applies_when": "program starts with OnlyTakerTokenBalanceNonZero", "plain": "Anyone who does not hold the gate token cannot fill this order.", "why_it_is_strong": "This was proved with the rest of the program left completely unknown \u2014 a symbolic tail. So it holds for ANY program you build after the gate block, including ones nobody has written yet. No test suite can cover that set.", "assumptions": ["The gate token answers balanceOf like an ordinary ERC-20.", "The gate block is the FIRST instruction. Move it later and the theorem no longer applies \u2014 instructions before it run first.", "The instruction rules are conformance-TESTED against the real VM, not themselves proven. The theorem holds given each instruction behaves as its rule says."], "holds": false, "because": "T0 needs the gate as the FIRST instruction. Anything before it runs first, so the theorem says nothing about this arrangement.", "docfile": "semantics/proofs/gate-spec.k"}, {"id": "T1", "file": "semantics/proofs/pricing-spec.k", "applies_when": "gate + StaticBalances + LimitSwap, exact-in", "plain": "The taker receives exactly the maker's advertised rate, rounded down to the wei. Never a wei more, never a wei less.", "why_it_is_strong": "Proved with the trade size and BOTH maker reserves left as unknowns, so it covers every pool size and every order size at once. The two bounds together pin the answer exactly: one alone would be satisfied by quoting zero.", "assumptions": ["amountIn * balanceOut stays below 2^256. Above that the real EVM reverts and the model computes, so they disagree \u2014 and a taker can choose an amountIn that large.", "Rounding goes to the maker. That is deliberate and documented, not a bug."], "holds": false, "because": "The pricing theorems were proved about the exact sequence gate -> maker reserves -> limit swap. This program has a different shape.", "docfile": "semantics/proofs/pricing-spec.k"}], "lint": [{"level": "error", "pc": 0, "text": "Gate token needs exactly 20 bytes; this block declares 19.", "why": "address(bytes20(args)) right-zero-pads a short value without reverting, so the gate would silently check a DIFFERENT address than you intended.", "source": "semantics/swapvm.md, \"Malformed arguments on a MODELLED opcode\""}], "proof": null, "exec": {"0": {"GATE": "0x0000000000000000000000000000000000000090", "available": true, "config": {"gateBalance": 0}, "error": "unknown selector 0x", "raw": [], "recorded": true, "selector": "", "status": "reverted"}, "5": {"GATE": "0x0000000000000000000000000000000000000090", "available": true, "config": {"gateBalance": 5}, "error": "unknown selector 0x", "raw": [], "recorded": true, "selector": "", "status": "reverted"}}, "expect": {"pc": 90, "status": "Running", "amountOut": null}, "sources": {"src/instructions/Controls.sol::_onlyTakerTokenBalanceNonZero": {"kind": "solidity", "path": "src/instructions/Controls.sol", "fn": "_onlyTakerTokenBalanceNonZero", "opcode": "23", "text": "    /// @dev Checks if the taker holds any amount of the specified token (NFTs are natively supported)\n    /// @dev Since EIP-7702, user may delegate it's account to certain code, potentially sharing authorization\n    ///   given even by soulbound NFT with other users\n    /// @param args.token | 20 bytes\n    function _onlyTakerTokenBalanceNonZero(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        require(balance > 0, TakerTokenBalanceIsZero(ctx.query.taker, token));\n    }", "full": "// SPDX-License-Identifier: LicenseRef-Degensoft-SwapVM-1.1\npragma solidity 0.8.30;\n\n/// @custom:license-url https://github.com/1inch/swap-vm/blob/main/LICENSES/SwapVM-1.1.txt\n/// @custom:copyright \u00a9 2025 Degensoft Ltd\n\nimport { IERC20 } from \"@openzeppelin/contracts/token/ERC20/IERC20.sol\";\n\nimport { Calldata } from \"@1inch/solidity-utils/contracts/libraries/Calldata.sol\";\nimport { Context, ContextLib } from \"../libs/VM.sol\";\n\nlibrary ControlsArgsBuilder {\n    function buildSalt(uint64 salt) internal pure returns (bytes memory) {\n        return abi.encodePacked(salt);\n    }\n\n    function buildSalt(bytes memory salt) internal pure returns (bytes memory) {\n        return salt;\n    }\n\n    function buildRevert(bytes4 exception) internal pure returns (bytes memory) {\n        return abi.encodePacked(exception);\n    }\n\n    function buildRevert(bytes memory exception) internal pure returns (bytes memory) {\n        return exception;\n    }\n\n    function buildJump(uint16 nextPC) internal pure returns (bytes memory) {\n        return abi.encodePacked(nextPC);\n    }\n\n    function buildJumpIfDirection(address tokenIn, address tokenOut, uint16 nextPC) internal pure returns (bytes memory) {\n        return abi.encodePacked(tokenIn < tokenOut, nextPC);\n    }\n\n    function buildJumpIfToken(address token, uint16 nextPC) internal pure returns (bytes memory) {\n        return abi.encodePacked(token, nextPC);\n    }\n\n    function buildDeadline(uint40 deadline) internal pure returns (bytes memory) {\n        return abi.encodePacked(deadline);\n    }\n\n    function buildTokenBalanceNonZero(address token) internal pure returns (bytes memory) {\n        return abi.encodePacked(token);\n    }\n\n    function buildTakerTokenBalanceGte(address token, uint256 minAmount) internal pure returns (bytes memory) {\n        return abi.encodePacked(token, minAmount);\n    }\n\n    function buildTakerTokenSupplyShareGte(address token, uint64 minShareE18) internal pure returns (bytes memory) {\n        return abi.encodePacked(token, minShareE18);\n    }\n}\n\n/// @title Controls\n/// @dev A set of functions for executing hooks in the SwapVM protocol\n/// It manages the program counter and executes hooks based on the current state\ncontract Controls {\n    using Calldata for bytes;\n    using ContextLib for Context;\n\n    error InstructionRevert(bytes);\n    error DeadlineReached(address taker, uint256 deadline);\n    error TakerTokenBalanceIsZero(address taker, address token);\n    error TxOriginTokenBalanceIsZero(address txOrigin, address token);\n    error TakerTokenBalanceIsLessThanRequired(address taker, address token, uint256 balance, uint256 minAmount);\n    error TakerTokenBalanceSupplyShareIsLessThanRequired(address taker, address token, uint256 balance, uint256 totalSupply, uint256 minShareE18);\n\n    /// @dev This instruction does nothing and can be used for uniqueness order hash value.\n    function _salt(Context memory /* ctx */, bytes calldata /* args */) internal pure { }\n\n    /// @dev Unconditional jump to the specified program counter\n    /// @dev LIMITATION: Jump targets are limited to uint16 (0-65,535) due to 2-byte encoding.\n    ///      For jumps to positions >= 65,536, use Extruction with custom control flow logic.\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jump(Context memory ctx, bytes calldata args) internal pure {\n        uint256 nextPC = uint16(bytes2(args));\n        ctx.setNextPC(nextPC);\n    }\n\n    /// @dev Unconditional revert with specified reason encoded\n    function _revert(Context memory, bytes calldata args) internal pure {\n        revert InstructionRevert(args);\n    }\n\n    /// @dev Unconditional succesful execution stop\n    function _stop(Context memory ctx, bytes calldata) internal pure {\n        // VM has nothing to execute out of program bounds\n        ctx.setNextPC(type(uint256).max);\n    }\n\n    /// @dev Jumps if swap direction matches the expected one\n    function _jumpIfDirection(Context memory ctx, bytes calldata args) internal pure {\n        bool expectedDirection = bytes1(args) != 0;\n        bool swapDirection = ctx.query.tokenIn < ctx.query.tokenOut;\n        if (expectedDirection == swapDirection) {\n            uint256 nextPC = uint16(bytes2(args.slice(1)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Jumps if tokenIn is the specified token\n    /// @dev LIMITATION: Jump targets limited to uint16 (0-65,535). See _jump for details.\n    /// @param args.token  | 20 bytes\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jumpIfTokenIn(Context memory ctx, bytes calldata args) internal pure {\n        address token = address(bytes20(args));\n        if (token == ctx.query.tokenIn) {\n            uint256 nextPC = uint16(bytes2(args.slice(20)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Jumps if tokenOut is the specified token\n    /// @dev LIMITATION: Jump targets limited to uint16 (0-65,535). See _jump for details.\n    /// @param args.token  | 20 bytes\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jumpIfTokenOut(Context memory ctx, bytes calldata args) internal pure {\n        address token = address(bytes20(args));\n        if (token == ctx.query.tokenOut) {\n            uint256 nextPC = uint16(bytes2(args.slice(20)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Reverts if the deadline has been reached\n    /// @param args.deadline | 5 bytes\n    function _deadline(Context memory ctx, bytes calldata args) internal view {\n        uint256 deadline = uint40(bytes5(args));\n        require(block.timestamp <= deadline, DeadlineReached(ctx.query.taker, deadline));\n    }\n\n    /// @dev Checks if the taker holds any amount of the specified token (NFTs are natively supported)\n    /// @dev Since EIP-7702, user may delegate it's account to certain code, potentially sharing authorization\n    ///   given even by soulbound NFT with other users\n    /// @param args.token | 20 bytes\n    function _onlyTakerTokenBalanceNonZero(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        require(balance > 0, TakerTokenBalanceIsZero(ctx.query.taker, token));\n    }\n\n    /// @dev Checks if tx.origin holds any amount of the specified token (NFTs are natively supported)\n    /// @dev The opcode allows authorized user to fill the order through 3rd-party contracts\n    ///   Validations through tx.origin are considered weak due to possible transaction flow interception\n    ///   E.g. authorized user performs transaction to 3rd-party protocol with no order filling intention,\n    ///   the 3rd-party protocol may use the authorization to fill the order\n    /// @param args.token | 20 bytes\n    function _onlyTxOriginTokenBalanceNonZero(Context memory /* ctx */, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 balance = IERC20(token).balanceOf(tx.origin);\n        require(balance > 0, TxOriginTokenBalanceIsZero(tx.origin, token));\n    }\n\n    /// @dev Checks if the taker holds at least a certain amount of tokens\n    /// @param args.token     | 20 bytes\n    /// @param args.minAmount | 32 bytes\n    function _onlyTakerTokenBalanceGte(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 minAmount = uint256(bytes32(args.slice(20)));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        require(balance >= minAmount, TakerTokenBalanceIsLessThanRequired(ctx.query.taker, token, balance, minAmount));\n    }\n\n    /// @dev Checks if the taker holds at least a certain share of the total token supply\n    /// @param args.token       | 20 bytes\n    /// @param args.minShareE18 | 8 bytes\n    function _onlyTakerTokenSupplyShareGte(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 minShareE18 = uint64(bytes8(args.slice(20)));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        uint256 totalSupply = IERC20(token).totalSupply();\n        // balance * 1e18 / totalSupply >= minShareE18\n        require(totalSupply > 0 && balance * 1e18 >= minShareE18 * totalSupply, TakerTokenBalanceSupplyShareIsLessThanRequired(ctx.query.taker, token, balance, totalSupply, minShareE18));\n    }\n}\n", "full_lines": 180, "contract": {"kind": "contract", "name": "Controls", "doc": "@title Controls\n@dev A set of functions for executing hooks in the SwapVM protocol\nIt manages the program counter and executes hooks based on the current state", "handles": ["Deadline", "Jump", "JumpIfDirection", "JumpIfTokenIn", "JumpIfTokenOut", "OnlyTakerTokenBalanceGte", "OnlyTakerTokenBalanceNonZero", "OnlyTakerTokenSupplyShareGte", "OnlyTxOriginTokenBalanceNonZero", "Revert", "Salt", "Stop"]}}, "src/instructions/Balances.sol::_staticBalancesXD": {"kind": "solidity", "path": "src/instructions/Balances.sol", "fn": "_staticBalancesXD", "opcode": "90", "text": "    /// @dev Sets ctx.swap.balanceIn/Out from provided initial balances\n    /// @param args.initialBalances[2] | 32 bytes * 2\n    function _staticBalancesXD(Context memory ctx, bytes calldata args) internal pure {\n        require(ctx.swap.balanceIn == 0 && ctx.swap.balanceOut == 0, SetBalancesExpectZeroBalances(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        uint256 balanceIn;\n        uint256 balanceOut;\n        if (ctx.query.tokenIn < ctx.query.tokenOut) (balanceIn, balanceOut) = BalancesArgsBuilder.parse(args);\n        else (balanceOut, balanceIn) = BalancesArgsBuilder.parse(args);\n\n        ctx.swap.balanceIn = balanceIn;\n        ctx.swap.balanceOut = balanceOut;\n    }", "full": "// SPDX-License-Identifier: LicenseRef-Degensoft-SwapVM-1.1\npragma solidity 0.8.30;\n\n/// @custom:license-url https://github.com/1inch/swap-vm/blob/main/LICENSES/SwapVM-1.1.txt\n/// @custom:copyright \u00a9 2025 Degensoft Ltd\n\nimport { SafeCast } from \"@openzeppelin/contracts/utils/math/SafeCast.sol\";\n\nimport { Calldata } from \"@1inch/solidity-utils/contracts/libraries/Calldata.sol\";\nimport { Context, ContextLib } from \"../libs/VM.sol\";\n\nlibrary BalancesArgsBuilder {\n    using SafeCast for uint256;\n    using Calldata for bytes;\n\n    function build(uint256[2] memory balances) internal pure returns (bytes memory) {\n        return abi.encodePacked(balances[0], balances[1]);\n    }\n\n    function parse(bytes calldata args) internal pure returns (uint256 balanceA, uint256 balanceB) {\n        balanceA = uint256(bytes32(args));\n        balanceB = uint256(bytes32(args.slice(32)));\n    }\n}\n\ncontract Balances {\n    using Calldata for bytes;\n    using ContextLib for Context;\n\n    error SetBalancesExpectZeroBalances(uint256 balanceIn, uint256 balanceOut);\n\n    mapping(bytes32 orderHash =>\n        mapping(address token => uint256)) public balances;\n\n    /// @dev Sets ctx.swap.balanceIn/Out from provided initial balances\n    /// @param args.initialBalances[2] | 32 bytes * 2\n    function _staticBalancesXD(Context memory ctx, bytes calldata args) internal pure {\n        require(ctx.swap.balanceIn == 0 && ctx.swap.balanceOut == 0, SetBalancesExpectZeroBalances(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        uint256 balanceIn;\n        uint256 balanceOut;\n        if (ctx.query.tokenIn < ctx.query.tokenOut) (balanceIn, balanceOut) = BalancesArgsBuilder.parse(args);\n        else (balanceOut, balanceIn) = BalancesArgsBuilder.parse(args);\n\n        ctx.swap.balanceIn = balanceIn;\n        ctx.swap.balanceOut = balanceOut;\n    }\n\n    /// @dev Load or init ctx.swap.balanceIn/Out from provided initial balances,\n    ///      then execute sub-instruction and apply swap amounts to stored balances\n    /// @dev QUOTE/SWAP DIVERGENCE: In quote mode (isStaticContext=true), this instruction reads balances\n    ///   but does NOT update them after nested instructions complete. Quote may succeed while swap reverts\n    ///   if balances were modified between quote and swap calls. Makers MUST NOT use backward jumps to\n    ///   this instruction as it breaks numerical consistency between quote() and swap().\n    /// @param args.initialBalances[2] | 32 bytes * 2\n    function _dynamicBalancesXD(Context memory ctx, bytes calldata args) internal {\n        require(ctx.swap.balanceIn == 0 && ctx.swap.balanceOut == 0, SetBalancesExpectZeroBalances(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        uint256 balanceIn = balances[ctx.query.orderHash][ctx.query.tokenIn];\n        uint256 balanceOut = balances[ctx.query.orderHash][ctx.query.tokenOut];\n\n        if (balanceIn | balanceOut == 0) {\n            if (ctx.query.tokenIn < ctx.query.tokenOut) (balanceIn, balanceOut) = BalancesArgsBuilder.parse(args);\n            else (balanceOut, balanceIn) = BalancesArgsBuilder.parse(args);\n\n            if (!ctx.vm.isStaticContext) {\n                balances[ctx.query.orderHash][ctx.query.tokenIn] = balanceIn;\n                balances[ctx.query.orderHash][ctx.query.tokenOut] = balanceOut;\n            }\n        }\n\n        ctx.swap.balanceIn = balanceIn;\n        ctx.swap.balanceOut = balanceOut;\n\n        ctx.runLoop();\n\n        if (!ctx.vm.isStaticContext) {\n            balances[ctx.query.orderHash][ctx.query.tokenIn] += ctx.swap.amountIn;\n            balances[ctx.query.orderHash][ctx.query.tokenOut] -= ctx.swap.amountOut;\n        }\n    }\n}\n", "full_lines": 83, "contract": {"kind": "contract", "name": "Balances", "doc": "", "handles": ["DynamicBalances", "StaticBalances"]}}, "src/instructions/LimitSwap.sol::_limitSwap1D": {"kind": "solidity", "path": "src/instructions/LimitSwap.sol", "fn": "_limitSwap1D", "opcode": "53", "text": "    /// @param args.makerDirectionLt | 1 byte (boolean, true if tokenIn < tokenOut)\n    function _limitSwap1D(Context memory ctx, bytes calldata args) internal pure {\n        require(ctx.swap.balanceIn > 0 && ctx.swap.balanceOut > 0, LimitSwapRequiresBothBalancesNonZero(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        bool makerDirectionLt = LimitSwapArgsBuilder.parse(args);\n        bool takerDirectionLt = ctx.query.tokenIn < ctx.query.tokenOut;\n        require(makerDirectionLt == takerDirectionLt, LimitSwapDirectionMismatch());\n\n        if (ctx.query.isExactIn) {\n            require(ctx.swap.amountOut == 0, LimitSwapRecomputeDetected());\n            ctx.swap.amountOut = ctx.swap.amountIn * ctx.swap.balanceOut / ctx.swap.balanceIn; // Floor division for tokenOut is desired behavior\n        } else {\n            require(ctx.swap.amountIn == 0, LimitSwapRecomputeDetected());\n            ctx.swap.amountIn = (ctx.swap.amountOut * ctx.swap.balanceIn).ceilDiv(ctx.swap.balanceOut); // Ceiling division for tokenIn is desired behavior\n        }\n    }", "full": "// SPDX-License-Identifier: LicenseRef-Degensoft-SwapVM-1.1\npragma solidity 0.8.30;\n\n/// @custom:license-url https://github.com/1inch/swap-vm/blob/main/LICENSES/SwapVM-1.1.txt\n/// @custom:copyright \u00a9 2025 Degensoft Ltd\n\nimport { Math } from \"@openzeppelin/contracts/utils/math/Math.sol\";\n\nimport { Calldata } from \"@1inch/solidity-utils/contracts/libraries/Calldata.sol\";\nimport { Context, ContextLib } from \"../libs/VM.sol\";\n\nlibrary LimitSwapArgsBuilder {\n    using Calldata for bytes;\n\n    /// @notice Build instruction arguments for LimitSwap\n    /// @param tokenIn Input token address\n    /// @param tokenOut Output token address\n    /// @return Packed bytes encoding swap direction (1 byte boolean: tokenIn < tokenOut)\n    function build(address tokenIn, address tokenOut) internal pure returns (bytes memory) {\n        return abi.encodePacked(tokenIn < tokenOut);\n    }\n\n    function parse(bytes calldata args) internal pure returns (bool makerDirectionLt) {\n        makerDirectionLt = uint8(bytes1(args)) != 0;\n    }\n}\n\n/// @dev Use with Balances._setBalance() instruction to ensure both balances are non-zero before proceeding with swap.\ncontract LimitSwap {\n    using Math for uint256;\n    using ContextLib for Context;\n\n    error LimitSwapDirectionMismatch();\n    error LimitSwapRecomputeDetected();\n    error LimitSwapRequiresBothBalancesNonZero(uint256 balanceIn, uint256 balanceOut);\n    error LimitSwapFullyRequiresAmountInToMatchBalanceIn(uint256 amountIn, uint256 balanceIn);\n    error LimitSwapFullyRequiresAmountOutToMatchBalanceOut(uint256 amountOut, uint256 balanceOut);\n\n    /// @param args.makerDirectionLt | 1 byte (boolean, true if tokenIn < tokenOut)\n    function _limitSwap1D(Context memory ctx, bytes calldata args) internal pure {\n        require(ctx.swap.balanceIn > 0 && ctx.swap.balanceOut > 0, LimitSwapRequiresBothBalancesNonZero(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        bool makerDirectionLt = LimitSwapArgsBuilder.parse(args);\n        bool takerDirectionLt = ctx.query.tokenIn < ctx.query.tokenOut;\n        require(makerDirectionLt == rection matches the expected one\n    function _jumpIfDirection(Context memory ctx, bytes calldata args) internal pure {\n        bool expectedDirection = bytes1(args) != 0;\n        bool swapDirection = ctx.query.tokenIn < ctx.query.tokenOut;\n        if (expectedDirection == swapDirection) {\n            uint256 nextPC = uint16(bytes2(args.slice(1)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Jumps if tokenIn is the specified token\n    /// @dev LIMITATION: Jump targets limited to uint16 (0-65,535). See _jump for details.\n    /// @param args.token  | 20 bytes\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jumpIfTokenIn(Context memory ctx, bytes calldata args) internal pure {\n        address token = address(bytes20(args));\n        if (token == ctx.query.tokenIn) {\n            uint256 nextPC = uint16(bytes2(args.slice(20)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Jumps if tokenOut is the specified token\n    /// @dev LIMITATION: Jump targets limited to uint16 (0-65,535). See _jump for details.\n    /// @param args.token  | 20 bytes\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jumpIfTokenOut(Context memory ctx, bytes calldata args) internal pure {\n        address token = address(bytes20(args));\n        if (token == ctx.query.tokenOut) {\n            uint256 nextPC = uint16(bytes2(args.slice(20)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Reverts if the deadline has been reached\n    /// @param args.deadline | 5 bytes\n    function _deadline(Context memory ctx, bytes calldata args) internal view {\n        uint256 deadline = uint40(bytes5(args));\n        require(block.timestamp <= deadline, DeadlineReached(ctx.query.taker, deadline));\n    }\n\n    /// @dev Checks if the taker holds any amount of the specified token (NFTs are natively supported)\n    /// @dev Since EIP-7702, user may delegate it's account to certain code, potentially sharing a olds any amount of the specified token (NFTs are natively supported)\n    /// @dev The opcode allows authorized user to fill the order through 3rd-party contracts\n    ///   Validations through tx.origin are considered weak due to possible transaction flow interception\n    ///   E.g. authorized user performs transaction to 3rd-party protocol with no order filling intention,\n    ///   the 3rd-party protocol may use the authorization to fill the order\n    /// @param args.token | 20 bytes\n    function _onlyTxOriginTokenBalanceNonZero(Context memory /* ctx */, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 balance = IERC20(token).balanceOf(tx.origin);\n        require(balance > 0, TxOriginTokenBalanceIsZero(tx.origin, token));\n    }\n\n    /// @dev Checks if the taker holds at least a certain amount of tokens\n    /// @param args.token     | 20 bytes\n    /// @param args.minAmount | 32 bytes\n    function _onlyTakerTokenBalanceGte(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 minAmount = uint256(bytes32(args.slice(20)));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        require(balance >= minAmount, TakerTokenBalanceIsLessThanRequired(ctx.query.taker, token, balance, minAmount));\n    }\n\n    /// @dev Checks if the taker holds at least a certain share of the total token supply\n    /// @param args.token       | 20 bytes\n    /// @param args.minShareE18 | 8 bytes\n    function _onlyTakerTokenSupplyShareGte(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 minShareE18 = uint64(bytes8(args.slice(20)));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        uint256 totalSupply = IERC20(token).totalSupply();\n        // balance * 1e18 / totalSupply >= minShareE18\n        require(totalSupply > 0 && balance * 1e18 >= textLib for Context;\n\n    error XYCSwapRecomputeDetected();\n    error XYCSwapRequiresBothBalancesNonZero(uint256 balanceIn, uint256 balanceOut);\n\n    function _xycSwapXD(Context memory ctx, bytes calldata /* args */) internal pure {\n        require(ctx.swap.balanceIn > 0 && ctx.swap.balanceOut > 0, XYCSwapRequiresBothBalancesNonZero(ctx.swap.balanceIn, ctx.swap.balanceOut));\n\n        if (ctx.query.isExactIn) {\n            require(ctx.swap.amountOut == 0, XYCSwapRecomputeDetected());\n            ctx.swap.amountOut = (\n                (ctx.swap.amountIn * ctx.swap.balanceOut) /\n                (ctx.swap.balanceIn + ctx.swap.amountIn)\n            );\n        } else {\n            require(ctx.swap.amountIn == 0, XYCSwapRecomputeDetected());\n            ctx.swap.amountIn = Math.ceilDiv(\n                ctx.swap.amountOut * ctx.swap.balanceIn,\n                (ctx.swap.balanceOut - ctx.swap.amountOut)\n            );\n        }\n    }\n}\n", "full_lines": 35, "contract": {"kind": "contract", "name": "XYCSwap", "doc": "", "handles": ["XYCSwap"]}}, "src/instructions/Controls.sol::_salt": {"kind": "solidity", "path": "src/instructions/Controls.sol", "fn": "_salt", "opcode": "02", "text": "    /// @dev This instruction does nothing and can be used for uniqueness order hash value.\n    function _salt(Context memory /* ctx */, bytes calldata /* args */) internal pure { }", "full": "// SPDX-License-Identifier: LicenseRef-Degensoft-SwapVM-1.1\npragma solidity 0.8.30;\n\n/// @custom:license-url https://github.com/1inch/swap-vm/blob/main/LICENSES/SwapVM-1.1.txt\n/// @custom:copyright \u00a9 2025 Degensoft Ltd\n\nimport { IERC20 } from \"@openzeppelin/contracts/token/ERC20/IERC20.sol\";\n\nimport { Calldata } from \"@1inch/solidity-utils/contracts/libraries/Calldata.sol\";\nimport { Context, ContextLib } from \"../libs/VM.sol\";\n\nlibrary ControlsArgsBuilder {\n    function buildSalt(uint64 salt) internal pure returns (bytes memory) {\n        return abi.encodePacke
