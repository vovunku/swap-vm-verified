ress token);\n    error TakerTokenBalanceIsLessThanRequired(address taker, address token, uint256 balance, uint256 minAmount);\n    error TakerTokenBalanceSupplyShareIsLessThanRequired(address taker, address token, uint256 balance, uint256 totalSupply, uint256 minShareE18);\n\n    /// @dev This instruction does nothing and can be used for uniqueness order hash value.\n    function _salt(Context memory /* ctx */, bytes calldata /* args */) internal pure { }\n\n    /// @dev Unconditional jump to the specified program counter\n    /// @dev LIMITATION: Jump targets are limited to uint16 (0-65,535) due to 2-byte encoding.\n    ///      For jumps to positions >= 65,536, use Extruction with custom control flow logic.\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jump(Context memory ctx, bytes calldata args) internal pure {\n        uint256 nextPC = uint16(bytes2(args));\n        ctx.setNextPC(nextPC);\n    }\n\n    /// @dev Unconditional revert with specified reason encoded\n    function _revert(Context memory, bytes calldata args) internal pure {\n        revert InstructionRevert(args);\n    }\n\n    /// @dev Unconditional succesful execution stop\n    function _stop(Context memory ctx, bytes calldata) internal pure {\n        // VM has nothing to execute out of program bounds\n        ctx.setNextPC(type(uint256).max);\n    }\n\n    /// @dev Jumps if swap direction matches the expected one\n    function _jumpIfDirection(Context memory ctx, bytes calldata args) internal pure {\n        bool expectedDirection = bytes1(args) != 0;\n        bool swapDirection = ctx.query.tokenIn < ctx.query.tokenOut;\n        if (expectedDirection == swapDirection) {\n            uint256 nextPC = uint16(bytes2(args.slice(1)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Jumps if tokenIn is the specified token\n    /// @dev LIMITATION: Jump targets limited to uint16 (0-65,535). See _jump for details.\n    /// @param args.token  | 20 bytes\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jumpIfTokenIn(Context memory ctx, bytes calldata args) internal pure {\n        address token = address(bytes20(args));\n        if (token == ctx.query.tokenIn) {\n            uint256 nextPC = uint16(bytes2(args.slice(20)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Jumps if tokenOut is the specified token\n    /// @dev LIMITATION: Jump targets limited to uint16 (0-65,535). See _jump for details.\n    /// @param args.token  | 20 bytes\n    /// @param args.nextPC | 2 bytes (uint16)\n    function _jumpIfTokenOut(Context memory ctx, bytes calldata args) internal pure {\n        address token = address(bytes20(args));\n        if (token == ctx.query.tokenOut) {\n            uint256 nextPC = uint16(bytes2(args.slice(20)));\n            ctx.setNextPC(nextPC);\n        }\n    }\n\n    /// @dev Reverts if the deadline has been reached\n    /// @param args.deadline | 5 bytes\n    function _deadline(Context memory ctx, bytes calldata args) internal view {\n        uint256 deadline = uint40(bytes5(args));\n        require(block.timestamp <= deadline, DeadlineReached(ctx.query.taker, deadline));\n    }\n\n    /// @dev Checks if the taker holds any amount of the specified token (NFTs are natively supported)\n    /// @dev Since EIP-7702, user may delegate it's account to certain code, potentially sharing authorization\n    ///   given even by soulbound NFT with other users\n    /// @param args.token | 20 bytes\n    function _onlyTakerTokenBalanceNonZero(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        require(balance > 0, TakerTokenBalanceIsZero(ctx.query.taker, token));\n    }\n\n    /// @dev Checks if tx.origin holds any amount of the specified token (NFTs are natively supported)\n    /// @dev The opcode allows authorized user to fill the order through 3rd-party contracts\n    ///   Validations through tx.origin are considered weak due to possible transaction flow interception\n    ///   E.g. authorized user performs transaction to 3rd-party protocol with no order filling intention,\n    ///   the 3rd-party protocol may use the authorization to fill the order\n    /// @param args.token | 20 bytes\n    function _onlyTxOriginTokenBalanceNonZero(Context memory /* ctx */, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 balance = IERC20(token).balanceOf(tx.origin);\n        require(balance > 0, TxOriginTokenBalanceIsZero(tx.origin, token));\n    }\n\n    /// @dev Checks if the taker holds at least a certain amount of tokens\n    /// @param args.token     | 20 bytes\n    /// @param args.minAmount | 32 bytes\n    function _onlyTakerTokenBalanceGte(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 minAmount = uint256(bytes32(args.slice(20)));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        require(balance >= minAmount, TakerTokenBalanceIsLessThanRequired(ctx.query.taker, token, balance, minAmount));\n    }\n\n    /// @dev Checks if the taker holds at least a certain share of the total token supply\n    /// @param args.token       | 20 bytes\n    /// @param args.minShareE18 | 8 bytes\n    function _onlyTakerTokenSupplyShareGte(Context memory ctx, bytes calldata args) internal view {\n        address token = address(bytes20(args));\n        uint256 minShareE18 = uint64(bytes8(args.slice(20)));\n        uint256 balance = IERC20(token).balanceOf(ctx.query.taker);\n        uint256 totalSupply = IERC20(token).totalSupply();\n        // balance * 1e18 / totalSupply >= minShareE18\n        require(totalSupply > 0 && balance * 1e18 >= minShareE18 * totalSupply, TakerTokenBalanceSupplyShareIsLessThanRequired(ctx.query.taker, token, balance, totalSupply, minShareE18));\n    }\n}\n", "full_lines": 180, "contract": {"kind": "contract", "name": "Controls", "doc": "@title Controls\n@dev A set of functions for executing hooks in the SwapVM protocol\nIt manages the program counter and executes hooks based on the current state", "handles": ["Deadline", "Jump", "JumpIfDirection", "JumpIfTokenIn", "JumpIfTokenOut", "OnlyTakerTokenBalanceGte", "OnlyTakerTokenBalanceNonZero", "OnlyTakerTokenSupplyShareGte", "OnlyTxOriginTokenBalanceNonZero", "Revert", "Salt", "Stop"]}}, "dustproof/contracts/DustOrderBuilder.sol": {"kind": "solidity", "path": "dustproof/contracts/DustOrderBuilder.sol", "fn": null, "opcode": null, "text": "// SPDX-License-Identifier: MIT\npragma solidity 0.8.30;\n\nimport { ISwapVM } from \"@1inch/swap-vm/src/interfaces/ISwapVM.sol\";\nimport { MakerTraitsLib } from \"@1inch/swap-vm/src/libs/MakerTraits.sol\";\nimport { Opcode } from \"@1inch/swap-vm/src/libs/OpcodeList.sol\";\nimport { ControlsArgsBuilder } from \"@1inch/swap-vm/src/instructions/Controls.sol\";\nimport { Program, ProgramBuilder } from \"@1inch/swap-vm/test/utils/ProgramBuilder.sol\";\n\n/// @title DustOrderBuilder\n/// @notice Composes the ONE SwapVM program shape DustProof is willing to execute.\n///\n/// @dev THE BUILDER IS THE GUARANTEE.\n///\n///      A SwapVM order is a bytecode program, and an arbitrary program can do arbitrary\n///      things: `Extruction` (0x04) makes external calls from inside a program, and jump\n///      targets are two raw argument bytes with no bound or direction check. Rather than\n///      accept a maker-supplied program and try to check it afterwards, this contract is the\n///      only source of programs the system will run \u2014 and it can only emit one shape:\n///\n///          0x23  OnlyTakerTokenBalanceNonZero(gateToken)   gate\n///          0x20  Deadline(expiry)                          expiry\n///          0x50  XYCSwap                                   the curve\n///          0x02  Salt(nonce)                               uniqueness\n///\n///      There is deliberately no `StaticBalances`. In Aqua mode the maker's funds stay in\n///      their wallet and Aqua supplies the balances, so the maker's committed WETH *is* the\n///      budget. That is also why there is no invalidator: Aqua already bounds total payout,\n///      and `AquaOpcodes` does not dispatch `InvalidateTokenOut` at all.\n///\n///      ORDERING IS SEMANTIC, NOT COSMETIC. The gate is first because theorem T0\n///      (`semantics/proofs/gate-spec.k`, `kprove` returns `#Top`) is stated over programs\n///      that BEGIN with it, with the remainder of the program left symbolic. Move the gate\n///      later and the theorem stops applying \u2014 instructions before it would run first.\n///      `buildDustOrder` therefore fixes the order; it is not a parameter.\ncontract DustOrderBuilder {\n    using ProgramBuilder for Program;\n\n    error GateTokenRequired();\n    error DeadlineInThePast();\n\n    /// @notice Compose a dust-buying order for `token`, paid for in `weth`.\n    /// @param token     the dust token the maker is willing to buy\n    /// @param weth      the token the maker pays with (WETH)\n    /// @param gateToken token a taker must hold a non-zero balance of to fill. T0 applies.\n    /// @param expiry    unix timestamp after which the order stops being valid\n    /// @param salt      caller-supplied nonce; distinguishes otherwise-identical orders\n    function buildProgram(address token, address weth, address gateToken, uint40 expiry, uint64 salt)\n        public\n        view\n        returns (bytes memory)\n    {\n        if (gateToken == address(0)) revert GateTokenRequired();\n        if (expiry <= block.timestamp) revert DeadlineInThePast();\n        token; weth;   // the pair is carried by MakerTraits, not by a balances instruction\n\n        Program p = Program.wrap(0);   // Program is a UDVT (type Program is uint256); the builder ignores it\n        return bytes.concat(\n            // 0x23 \u2014 the gate. FIRST, so T0 applies to whatever follows.\n            p.build(Opcode.OnlyTakerTokenBalanceNonZero, ControlsArgsBuilder.buildTokenBalanceNonZero(gateToken)),\n            // 0x20 \u2014 expiry.\n            p.build(Opcode.Deadline, ControlsArgsBuilder.buildDeadline(expiry)),\n            // 0x50 \u2014 the curve. Balances come from Aqua.\n            p.build(Opcode.XYCSwap),\n            // 0x02 \u2014 uniqueness.\n            p.build(Opcode.Salt, ControlsArgsBuilder.buildSalt(salt))\n        );\n    }\n\n    /// @notice The full order: program bytes wrapped in Aqua-mode maker traits.\n    /// @dev `useAquaInsteadOfSignature = true` is what makes this an Aqua strategy \u2014 the\n    ///      maker ships it once and their wallet balance backs every fill.\n    function buildDustOrder(\n        address maker,\n        address token,\n        address weth,\n        address gateToken,\n        uint40 expiry,\n        uint64 salt\n    ) external view returns (ISwapVM.Order memory) {\n        return MakerTraitsLib.build(MakerTraitsLib.Args({\n            maker: maker,\n            tokenA: token,\n            tokenB: weth,\n            shouldUnwrapWeth: false,          // the TAKER decides this, per swap\n            useAquaInsteadOfSignature: true,\n            allowZeroAmountIn: false,\n            receiver: address(0),\n            hasPreTransferInHook: false,\n            hasPostTransferInHook: false,\n            hasPreTransferOutHook: false,\n            hasPostTransferOutHook: false,\n            preTransferInTarget: address(0),\n            preTransferInData: \"\",\n            postTransferInTarget: address(0),\n            postTransferInData: \"\",\n            preTransferOutTarget: address(0),\n            preTransferOutData: \"\",\n            postTransferOutTarget: address(0),\n            postTransferOutData: \"\",\n            program: buildProgram(token, weth, gateToken, expiry, salt)\n        }));\n    }\n}\n", "contract": {"kind": "contract", "name": "DustOrderBuilder", "doc": "@title DustOrderBuilder\n@notice Composes the ONE SwapVM program shape DustProof is willing to execute.\n\n@dev THE BUILDER IS THE GUARANTEE.\n\n     A SwapVM order is a bytecode program, and an arbitrary program can do arbitrary\n     things: `Extruction` (0x04) makes external calls from inside a program, and jump\n     targets are two raw argument bytes with no bound or direction check. Rather than\n     accept a maker-supplied program and try to check it afterwards, this contract is the\n     only source of programs the system will run \u2014 and it can only emit one shape:\n\n         0x23  OnlyTakerTokenBalanceNonZero(gateToken)   gate\n         0x20  Deadline(expiry)                          expiry\n         0x50  XYCSwap                                   the curve\n         0x02  Salt(nonce)                               uniqueness\n\n     There is deliberately no `StaticBalances`. In Aqua mode the maker's funds stay in\n     their wallet and Aqua supplies the balances, so the maker's committed WETH *is* the\n     budget. That is also why there is no invalidator: Aqua already bounds total payout,\n     and `AquaOpcodes` does not dispatch `InvalidateTokenOut` at all.\n\n     ORDERING IS SEMANTIC, NOT COSMETIC. The gate is first because theorem T0\n     (`semantics/proofs/gate-spec.k`, `kprove` returns `#Top`) is stated over programs\n     that BEGIN with it, with the remainder of the program left symbolic. Move the gate\n     later and the theorem stops applying \u2014 instructions before it would run first.\n     `buildDustOrder` therefore fixes the order; it is not a parameter.", "handles": []}}, "dustproof/contracts/DustSweeper.sol": {"kind": "solidity", "path": "dustproof/contracts/DustSweeper.sol", "fn": null, "opcode": null, "text": "// SPDX-License-Identifier: MIT\npragma solidity 0.8.30;\n\nimport { Multicall } from \"@openzeppelin/contracts/utils/Multicall.sol\";\nimport { Ownable } from \"@openzeppelin/contracts/access/Ownable.sol\";\nimport { SafeERC20, IERC20 } from \"@1inch/solidity-utils/contracts/libraries/SafeERC20.sol\";\n\nimport { ISwapVM } from \"@1inch/swap-vm/src/interfaces/ISwapVM.sol\";\n\ninterface ISwapVMRouter is ISwapVM {\n    function swap(ISwapVM.Order calldata order, uint256 amount, bytes calldata takerTraitsAndData)\n        external payable returns (uint256 amountIn, uint256 amountOut, bytes32 orderHash);\n}\n\n/// @title DustSweeper\n/// @notice Sweeps dust to ETH through verified Aqua programs. One token per call; batching\n///         is `Multicall`, so this contract contains no loop.\n///\n/// @dev WHY THERE IS NO LOOP HERE.\n///\n///      A SwapVM order fixes exactly one (tokenIn, tokenOut) pair. `ctx.query.tokenIn/tokenOut`\n///      are written once by the router (`SwapVM.sol:149-150`) and NO instruction anywhere\n///      writes them; settlement moves exactly one token (`:321`); and `_reentrancyGuards`\n///      (`:177`) blocks re-entry. So N dust tokens is always N calls to `swap()` \u2014 no program\n///      can loop across tokens, and no contract can make the VM do so.\n///\n///      Given that, the only question is who repeats the call. Using OpenZeppelin's\n///      `Multicall` rather than a hand-written loop buys three things: the batching is audited\n///      code we did not write, `msg.sender` is preserved through the self-`delegatecall` so\n///      tokens still come from the user, and \u2014 the reason that matters for this project \u2014\n///      every property is about ONE call. There is no loop invariant to prove.\n///\n///      WHY THERE IS NO WETH HANDLING. The router unwraps and delivers ETH itself when the\n///      taker sets `shouldUnwrapWeth` (`SwapVM.sol:330-333`, `IWETH.safeWithdrawTo(amount, to)`),\n///      and `to` is free-form in taker traits (`TakerTraits.sol:241`). Set `to` to the user and\n///      ETH lands in their wallet directly. This contract never holds WETH or ETH, so there is\n///      no accumulate/withdraw/forward sequence and no balance accounting to get wrong.\n///\n///      SLIPPAGE lives in each order's taker traits `threshold`, which the router enforces \u2014\n///      not here.\n///\n///      THE OZ MULTICALL CAVEAT applies and is handled: OpenZeppelin warns that \"any assumption\n///      about calldata validation performed by the sender may be violated\" for nested calls.\n///      `sweepOne` validates its own arguments \u2014 the registry check and the transfer amount \u2014\n///      rather than trusting the caller, which is exactly what that warning is about.\ncontract DustSweeper is Multicall, Ownable {\n    using SafeERC20 for IERC20;\n\n    ISwapVMRouter public immutable ROUTER;\n\n    /// @notice Order hashes whose program passed verification. This is the product's claim,\n    ///         enforced on chain rather than in a UI.\n    mapping(bytes32 orderHash => bool) public verified;\n\n    event OrderVerified(bytes32 indexed orderHash, bool status);\n    event Swept(address indexed user, address indexed token, uint256 amountIn, uint256 amountOut);\n\n    error OrderNotVerified(bytes32 orderHash);\n    error NothingToSweep();\n\n    constructor(ISwapVMRouter router, address owner_) Ownable(owner_) {\n        ROUTER = router;\n    }\n\n    /// @notice Record that an order's program passed verification.\n    /// @dev Deliberately explicit rather than derived on chain: the properties are proved\n    ///      off chain by `kprove`/`kontrol`, and this is where that result is published.\n    function setVerified(bytes32 orderHash, bool status) external onlyOwner {\n        verified[orderHash] = status;\n        emit OrderVerified(orderHash, status);\n    }\n\n    /// @notice Sweep one dust token into ETH via a verified order.\n    /// @param order      the maker's Aqua order; its hash must be in `verified`\n    /// @param token      the dust token being sold\n    /// @param amount     how much to sell \u2014 pulled from `msg.sender`\n    /// @param takerData  taker traits + data. MUST set `to = msg.sender` and\n    ///                   `shouldUnwrapWeth = true` so ETH reaches the user directly, and\n    ///                   SHOULD set `threshold` as the per-swap slippage bound.\n    function sweepOne(\n        ISwapVM.Order calldata order,\n        IERC20 token,\n        uint256 amount,\n        bytes calldata takerData\n    ) external {\n        if (amount == 0) revert NothingToSweep();\n\n        bytes32 orderHash = ROUTER.hash(order);\n        if (!verified[orderHash]) revert OrderNotVerified(orderHash);\n\n        token.safeTransferFrom(msg.sender, address(this), amount);\n        token.forceApprove(address(ROUTER), amount);\n\n        (uint256 amountIn, uint256 amountOut,) = ROUTER.swap(order, amount, takerData);\n\n        // Leave no standing allowance, even on a partial fill.\n        token.forceApprove(address(ROUTER), 0);\n\n        // Return anything the order did not consume, so a partial fill cannot strand dust here.\n        uint256 dust = token.balanceOf(address(this));\n        if (dust > 0) token.safeTransfer(msg.sender, dust);\n\n        emit Swept(msg.sender, address(token), amountIn, amountOut);\n    }\n}\n", "contract": {"kind": "contract", "name": "DustSweeper", "doc": "@title DustSweeper\n@notice Sweeps dust to ETH through verified Aqua programs. One token per call; batching\n        is `Multicall`, so this contract contains no loop.\n\n@dev WHY THERE IS NO LOOP HERE.\n\n     A SwapVM order fixes exactly one (tokenIn, tokenOut) pair. `ctx.query.tokenIn/tokenOut`\n     are written once by the router (`SwapVM.sol:149-150`) and NO instruction anywhere\n     writes them; settlement moves exactly one token (`:321`); and `_reentrancyGuards`\n     (`:177`) blocks re-entry. So N dust tokens is always N calls to `swap()` \u2014 no program\n     can loop across tokens, and no contract can make the VM do so.\n\n     Given that, the only question is who repeats the call. Using OpenZeppelin's\n     `Multicall` rather than a hand-written loop buys three things: the batching is audited\n     code we did not write, `msg.sender` is preserved through the self-`delegatecall` so\n     tokens still come from the user, and \u2014 the reason that matters for this project \u2014\n     every property is about ONE call. There is no loop invariant to prove.\n\n     WHY THERE IS NO WETH HANDLING. The router unwraps and delivers ETH itself when the\n     taker sets `shouldUnwrapWeth` (`SwapVM.sol:330-333`, `IWETH.safeWithdrawTo(amount, to)`),\n     and `to` is free-form in taker traits (`TakerTraits.sol:241`). Set `to` to the user and\n     ETH lands in their wallet directly. This contract never holds WETH or ETH, so there is\n     no accumulate/withdraw/forward sequence and no balance accounting to get wrong.\n\n     SLIPPAGE lives in each order's taker traits `threshold`, which the router enforces \u2014\n     not here.\n\n     THE OZ MULTICALL CAVEAT applies and is handled: OpenZeppelin warns that \"any assumption\n     about calldata validation performed by the sender may be violated\" for nested calls.\n     `sweepOne` validates its own arguments \u2014 the registry check and the transfer amount \u2014\n     rather than trusting the caller, which is exactly what that warning is about.", "handles": []}}, "semantics/proofs/gate-spec.k": {"kind": "k", "path": "semantics/proofs/gate-spec.k", "text": "claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\" +Bytes Int2Bytes(20, G, BE) +Bytes TAIL </program>\n        <pc> 0 => 22 </pc>\n        <balanceIn> _ </balanceIn> <balanceOut> _ </balanceOut>\n        <amountIn> _ </amountIn> <amountOut> _ </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> _ </isExactIn>\n        <tokenIn> _ </tokenIn> <tokenOut> _ </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running => Reverted(\"TakerTokenBalanceIsZero\") </status>\n        <trace> _ </trace>\n    requires 0 <=Int G andBool G <Int (2 ^Int 160)\n     andBool #balanceOf(BALS, G, TAKER) ==Int 0\n     // NOT decorative -- do not delete. It excludes no Bytes value semantically, but the\n     // backend needs it: once `lengthBytes(B1 +Bytes B2)` rewrites the program length to\n     // `22 +Int lengthBytes(TAIL)`, there is no axiom making `lengthBytes` non-negative, so\n     // without this the prover takes the `PC >= length` termination branch and the proof\n     // gets stuck at <pc> 0. Verified by deleting it.\n     andBool lengthBytes(TAIL) >=Int 0", "full": "module GATE-SPEC\n  imports SWAPVM\n  imports SWAPVM-BYTES-LEMMAS\n\n  // Phase 1 go/no-go.\n  //\n  // For ANY program that begins with OnlyTakerTokenBalanceNonZero(G) -- with TAIL an\n  // arbitrary, symbolic byte string -- a taker holding zero balance of G ends reverted.\n  //\n  // TAIL is never decoded: #revert discards the continuation, so its contents cannot affect\n  // the conclusion and the proof must not case-split on it.\n  claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\" +Bytes Int2Bytes(20, G, BE) +Bytes TAIL </program>\n        <pc> 0 => 22 </pc>\n        <balanceIn> _ </balanceIn> <balanceOut> _ </balanceOut>\n        <amountIn> _ </amountIn> <amountOut> _ </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> _ </isExactIn>\n        <tokenIn> _ </tokenIn> <tokenOut> _ </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running => Reverted(\"TakerTokenBalanceIsZero\") </status>\n        <trace> _ </trace>\n    requires 0 <=Int G andBool G <Int (2 ^Int 160)\n     andBool #balanceOf(BALS, G, TAKER) ==Int 0\n     // NOT decorative -- do not delete. It excludes no Bytes value semantically, but the\n     // backend needs it: once `lengthBytes(B1 +Bytes B2)` rewrites the program length to\n     // `22 +Int lengthBytes(TAIL)`, there is no axiom making `lengthBytes` non-negative, so\n     // without this the prover takes the `PC >= length` termination branch and the proof\n     // gets stuck at <pc> 0. Verified by deleting it.\n     andBool lengthBytes(TAIL) >=Int 0\n\nendmodule\n", "full_lines": 35, "focused": true}, "../dustproof/semantics/dustproof-spec.k": {"kind": "k", "path": "../dustproof/semantics/dustproof-spec.k", "text": "claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\xaa\\x20\\x05\\xff\\xff\\xff\\xff\\xff\\x50\\x00\\x02\\x08\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x01\" </program>\n        <pc> 0 => 41 </pc>\n        <balanceIn> BIN </balanceIn> <balanceOut> BOUT </balanceOut>\n        <amountIn> AIN </amountIn>\n        <amountOut> 0 => ?AOUT:Int </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> true </isExactIn>\n        <tokenIn> _ </tokenIn> <tokenOut> _ </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running </status>\n        <trace> _ </trace>\n    requires #balanceOf(BALS, 170, TAKER) >Int 0        // gate token 0x..aa == 170          // the gate PASSES\n     andBool #blockTimestamp() ==Int 1000000            // fixed: an inequality does NOT prune\n                                                        // the opposite arm (opcodes/deadline.md:125-156)\n     andBool 0 <Int BIN  andBool BIN  <Int (2 ^Int 256) // Aqua-supplied reserves, non-zero\n     andBool 0 <Int BOUT andBool BOUT <Int (2 ^Int 256)\n     andBool 0 <=Int AIN andBool AIN <Int (2 ^Int 256)\n    ensures ?AOUT *Int ( BIN +Int AIN ) <=Int AIN *Int BOUT\n    andBool ( ?AOUT +Int 1 ) *Int ( BIN +Int AIN ) >Int AIN *Int BOUT", "full": "requires \"../../swap-vm-verified/semantics/_lemmas-all.k\"\n\nmodule DUSTPROOF-SPEC\n  imports SWAPVM-BYTES-LEMMAS\n\n  // D1 -- the DustProof order quotes EXACTLY the constant-product floor.\n  //\n  // The program is the whole shape `DustOrderBuilder` emits, and nothing else:\n  //\n  //     0x23 0x14 <20-byte gateToken>   OnlyTakerTokenBalanceNonZero   pc  0 -> 22\n  //     0x20 0x05 <5-byte deadline>     Deadline                       pc 22 -> 29\n  //     0x50 0x00                       XYCSwap                        pc 29 -> 31\n  //     0x02 0x08 <8-byte salt>         Salt                           pc 31 -> 41\n  //\n  // This is the theorem the product rests on: for ANY maker reserves and ANY trade size, a\n  // taker who passes the gate and beats the deadline receives exactly\n  // `floor(amountIn * balanceOut / (balanceIn + amountIn))`. Not \"at most\", not \"about\" --\n  // exactly, to the wei.\n  //\n  // WHY BOTH BOUNDS. The first alone is satisfied by quoting zero; the second alone by\n  // quoting something enormous. Together they pin ?AOUT uniquely as the floor. This is the\n  // same two-sided shape as T1 (pricing-spec.k), and for the same reason: a one-sided bound\n  // is not a specification of a curve, it is a list of things a conservative quote happens\n  // to satisfy.\n  //\n  // NO StaticBalances, DELIBERATELY. In Aqua mode the maker's funds stay in their wallet and\n  // Aqua supplies the balances, so `AquaOpcodes` does not dispatch `StaticBalances` at all.\n  // The claim therefore takes `<balanceIn>`/`<balanceOut>` as symbolic and UNCHANGED rather\n  // than as something the program writes -- which is both the faithful model of Aqua mode and\n  // a stronger statement, since it quantifies over every reserve pair Aqua could supply.\n  //\n  // THE GATE IS FIRST, and that is load-bearing rather than stylistic. T0 (gate-spec.k) is\n  // stated over programs BEGINNING with `0x23 0x14 G` with an arbitrary symbolic tail, so it\n  // already covers this program: a taker holding zero `G` reverts before any pricing happens.\n  // D1 is the complement -- what happens on the path where the gate PASSES. Move the gate\n  // later in the program and T0 stops applying, which is why the builder fixes the order\n  // instead of taking it as a parameter.\n  //\n  // `#blockTimestamp() <=Int DL` is the not-expired branch. The expired branch reverts\n  // `DeadlineReached` and is covered separately; stating both in one claim would collapse\n  // them into a disjunction that proves less about either.\n  claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\xaa\\x20\\x05\\xff\\xff\\xff\\xff\\xff\\x50\\x00\\x02\\x08\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x01\" </program>\n        <pc> 0 => 41 </pc>\n        <balanceIn> BIN </balanceIn> <balanceOut> BOUT </balanceOut>\n        <amountIn> AIN </amountIn>\n        <amountOut> 0 => ?AOUT:Int </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> true </isExactIn>\n        <tokenIn> _ </tokenIn> <tokenOut> _ </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running </status>\n        <trace> _ </trace>\n    requires #balanceOf(BALS, 170, TAKER) >Int 0        // gate token 0x..aa == 170          // the gate PASSES\n     andBool #blockTimestamp() ==Int 1000000            // fixed: an inequality does NOT prune\n                                                        // the opposite arm (opcodes/deadline.md:125-156)\n     andBool 0 <Int BIN  andBool BIN  <Int (2 ^Int 256) // Aqua-supplied reserves, non-zero\n     andBool 0 <Int BOUT andBool BOUT <Int (2 ^Int 256)\n     andBool 0 <=Int AIN andBool AIN <Int (2 ^Int 256)\n    ensures ?AOUT *Int ( BIN +Int AIN ) <=Int AIN *Int BOUT\n    andBool ( ?AOUT +Int 1 ) *Int ( BIN +Int AIN ) >Int AIN *Int BOUT\n\nendmodule\n", "full_lines": 66, "focused": true}, "../dustproof/semantics/dustproof-control.k": {"kind": "k", "path": "../dustproof/semantics/dustproof-control.k", "text": "claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\xaa\\x20\\x05\\xff\\xff\\xff\\xff\\xff\\x50\\x00\\x02\\x08\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x01\" </program>\n        <pc> 0 => 41 </pc>\n        <balanceIn> BIN </balanceIn> <balanceOut> BOUT </balanceOut>\n        <amountIn> AIN </amountIn>\n        <amountOut> 0 => ?AOUT:Int </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> true </isExactIn>\n        <tokenIn> _ </tokenIn> <tokenOut> _ </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running </status>\n        <trace> _ </trace>\n    requires #balanceOf(BALS, 170, TAKER) >Int 0        // gate token 0x..aa == 170\n     andBool #blockTimestamp() ==Int 1000000            // fixed: an inequality does NOT prune\n                                                        // the opposite arm (opcodes/deadline.md:125-156)\n     andBool 0 <Int BIN  andBool BIN  <Int (2 ^Int 256)\n     andBool 0 <Int BOUT andBool BOUT <Int (2 ^Int 256)\n     andBool 0 <=Int AIN andBool AIN <Int (2 ^Int 256)\n    ensures ?AOUT *Int ( BIN +Int AIN ) >Int AIN *Int BOUT\n    andBool ( ?AOUT +Int 1 ) *Int ( BIN +Int AIN ) >Int AIN *Int BOUT", "full": "requires \"../../swap-vm-verified/semantics/_lemmas-all.k\"\n\nmodule DUSTPROOF-CONTROL\n  imports SWAPVM-BYTES-LEMMAS\n\n  // DELIBERATELY FALSE. Must FAIL.\n  //\n  // D1 with the maker-safety bound REVERSED: it asserts the taker receives strictly MORE than\n  // the exact curve value. Floor division cannot do that, so this must never prove.\n  //\n  // WHY A CONTROL AT ALL. A proof that cannot fail proves nothing, and the worst failure mode\n  // -- an inconsistent rule set -- proves EVERYTHING while looking like total success. This is\n  // the only check that catches it. If this ever returns #Top, D1 is worthless and so is every\n  // other theorem over the same definition.\n  //\n  // WHY THIS SHAPE. It keeps the CONCRETE program prefix and every hypothesis of D1, changing\n  // only the conclusion. proofs/README.md records why that matters: the first control written\n  // in this project failed at `<pc> 0`, before a single instruction executed, on a residual\n  // branch where no decode rule applies to a symbolic first byte -- and a review established\n  // that a claim which is TRUE fails with a byte-identical residual. It would have kept\n  // \"failing correctly\" with every instruction rule deleted. A control with a symbolic prefix\n  // cannot discriminate; this one reaches the arithmetic and fails on the value.\n  //\n  // Its sensitivity twin is D1 itself: same premises, correct conclusion, must PROVE. The pair\n  // is what shows kprove is discriminating on the conclusion rather than choking on the setup.\n  claim <k> #run => .K </k>\n        <program> b\"\\x23\\x14\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\xaa\\x20\\x05\\xff\\xff\\xff\\xff\\xff\\x50\\x00\\x02\\x08\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x01\" </program>\n        <pc> 0 => 41 </pc>\n        <balanceIn> BIN </balanceIn> <balanceOut> BOUT </balanceOut>\n        <amountIn> AIN </amountIn>\n        <amountOut> 0 => ?AOUT:Int </amountOut>\n        <netPulled> _ </netPulled>\n        <isExactIn> true </isExactIn>\n        <tokenIn> _ </tokenIn> <tokenOut> _ </tokenOut>\n        <taker> TAKER </taker>\n        <balances> BALS </balances>\n        <invalidators> _ </invalidators>\n        <status> Running </status>\n        <trace> _ </trace>\n    requires #balanceOf(BALS, 170, TAKER) >Int 0        // gate token 0x..aa == 170\n     andBool #blockTimestamp() ==Int 1000000            // fixed: an inequality does NOT prune\n                                                        // the opposite arm (opcodes/deadline.md:125-156)\n     andBool 0 <Int BIN  andBool BIN  <Int (2 ^Int 256)\n     andBool 0 <Int BOUT andBool BOUT <Int (2 ^Int 256)\n     andBool 0 <=Int AIN andBool AIN <Int (2 ^Int 256)\n    ensures ?AOUT *Int ( BIN +Int AIN ) >Int AIN *Int BOUT\n    andBool ( ?AOUT +Int 1 ) *Int ( BIN +Int AIN ) >Int AIN *Int BOUT\n\nendmodule\n", "full_lines": 50, "focused": true}}}], "opcodes": {"00": "Stop", "01": "Revert", "02": "Salt", "03": "Jump", "04": "Extruction", "10": "PrintSwapRegisters", "11": "PrintSwapQuery", "12": "PrintContext", "13": "PrintFreeMemoryPointer", "14": "PrintGasLeft", "1a": "PatchSwapRegisters", "20": "Deadline", "23": "OnlyTakerTokenBalanceNonZero", "24": "OnlyTakerTokenBalanceGte", "25": "OnlyTakerTokenSupplyShareGte", "26": "OnlyTxOriginTokenBalanceNonZero", "2b": "PrivateOrder", "2c": "WhitelistCoequal", "2d": "WhitelistSequential", "30": "JumpIfDirection", "31": "JumpIfTokenIn", "32": "JumpIfTokenOut", "40": "InvalidateBit", "41": "InvalidateTokenIn", "42": "InvalidateTokenOut", "48": "ValidateSeriesEpoch", "50": "XYCSwap", "51": "XYCConcentrateSwap", "53": "LimitSwap", "54": "LimitSwapFullAmount", "58": "PeggedSwap", "70": "FlatFeeAmountIn", "71": "ProtocolFeeAmountIn", "72": "AquaProtocolFeeAmountIn", "73": "ProgressiveFeeIn", "74": "DynamicProtocolFeeAmountIn", "75": "AquaDynamicProtocolFeeAmountIn", "80": "FlatFeeAmountOut", "81": "ProtocolFeeAmountOut", "82": "AquaProtocolFeeAmountOut", "83": "ProgressiveFeeOut", "90": "StaticBalances", "91": "DynamicBalances", "94": "DutchAuctionBalanceIn", "95": "DutchAuctionBalanceOut", "98": "PiecewiseLinearScaleBalanceIn", "99": "PiecewiseLinearScaleBalanceOut", "9c": "Decay", "9d": "TWAPSwap", "b0": "RequireMinRate", "b1": "AdjustMinRate", "b4": "BaseFeeAdjuster"}, "coverage": {"opcodes_modelled": 20, "opcodes_total": 52, "modelled_list": ["00", "01", "02", "03", "04", "20", "23", "24", "25", "26", "2b", "2c", "2d", "30", "31", "32", "42", "50", "53", "90"], "plain": "The K semantics models 20 of the 52 named opcodes. The decode loop is complete; the instruction set is not. Anything else falls through to a no-op in the model while the real VM     ${assumptions&&assumptions.length?`<details><summary>what this assumes (${assumptions.length})</summary>
      <ul>${assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></details>`:''}
    ${source?`<div class="src">${esc(source)}</div>`:''}</div>`;
}

function renderNav(){
  const cur8 = DATA.examples;
  const group = (title, arr) => arr.length ? `<h2>${title}</h2>` + arr.map(e => {
    const i = cur8.indexOf(e);
    const p = e.kind==='good' ? '<span class="pill good">verified</span>'
            : e.kind==='bad'  ? '<span class="pill bad">one byte wrong</span>' : '';
    return `<div class="item${i===cur?' on':''}" data-i="${i}">
      <div class="t">${esc(e.title)}${p}</div>
      <div class="d">${e.length} bytes · ${e.steps.length} instruction${e.steps.length===1?'':'s'}</div>
    </div>`;
  }).join('') : '';
  document.getElementById('nav').innerHTML =
    group('Start here', cur8.filter(e => e.kind==='good'||e.kind==='bad')) +
    group('Conformance examples', cur8.filter(e => e.kind==='conformance'));
  document.querySelectorAll('.item').forEach(el =>
    el.onclick = () => { cur = +el.dataset.i; render(); });
}

function renderSteps(e){
  if(!e.steps.length) return '<div class="bytes">empty program — zero bytes</div>';
  return e.steps.map(s => `<div class="step${s.error?' dead':''}">
    <span class="pc mono">pc ${s.pc}</span>
    <span class="op mono">${esc(s.op)} ${esc(s.name||'')}</span>
    <span class="ar mono">${s.error ? esc(s.error)
      : (s.argsLen ? esc(s.argsLen)+' arg byte'+(s.argsLen===1?'':'s')+
         (s.args?' · '+esc(s.args):'') : 'no arguments')}</span>
  </div>`).join('');
}

function renderProof(e){
  const p = e.proof;
  if(!p) return vblock('no','NO SPEC','No specification is paired with this program',
    'The catalogue examples exercise the semantics; only the three programs above carry a '+
    'machine-checked theorem.',
    'Verification here runs a human-written spec. Nothing generates one, and nothing guesses.',
    null, null);
  if(!p.available) return vblock('info','UNAVAILABLE','No recorded run', p.error, null, null, null);
  const sp = p.spec, ct = p.control;
  return `<div class="replay">↺ Recorded run, not live. This page is static — it has no prover
    behind it. Ran ${esc((DATA.recorded_at||'').replace('T',' ').replace('+00:00',' UTC'))}
    against K definition <span class="mono">${esc(DATA.definition.sha256_16||'?')}</span>.
    Re-run it yourself: <code>./semantics/run-proofs.sh</code></div>` +
    vblock(sp.top?'yes':'err', sp.top?'PROVED':'NOT PROVED',
      `${sp.spec}.k — kprove returned ${sp.top?'#Top':'no proof'}`,
      sp.top ? 'The theorem holds for every input in its stated domain.'
             : 'kprove did not return #Top.',
      `Took ${sp.seconds}s.`, null, (p.commands||[])[0]) +
    vblock(ct.exit!==0?'yes':'err', ct.exit!==0?'CONTROL OK':'CONTROL PROVED',
      `${ct.spec}.k — ${ct.verdict}`,
      ct.exit!==0 ? 'A deliberately false twin of the theorem. It must fail, and it did.'
                  : 'The false claim PROVED. The rule set is inconsistent and every result above is void.',
      'A proof that cannot fail proves nothing. This is the only check that catches an '+
      'inconsistent rule set, which otherwise proves everything while looking like total '+
      `success. Took ${ct.seconds}s.`, null, (p.commands||[])[1]);
}

function renderExec(e){
  const r = e.exec[gate];
  const bar = `<div class="gate">
    <button data-g="5" class="${gate===5?'on':''}">taker holds the gate token</button>
    <button data-g="0" class="${gate===0?'on':''}">taker holds none</button></div>`;
  if(!r) return bar + vblock('info','NO RUN','Not recorded','', null, null, null);
  const body = r.status==='completed'
    ? vblock('yes','EXECUTED','Ran to completion',
        `amountIn ${r.amountIn} → amountOut ${r.amountOut}`,
        `Real ContextLib.runLoop, real instruction bodies. Final pc ${r.nextPC}; `+
        `maker reserves ${r.balanceIn} / ${r.balanceOut}.`,
        ['The gate token\'s balanceOf is mocked so any gate address can be exercised.',
         'Dispatch routes to the real instruction bodies; only the dispatch table is the test\'s.'],
        'test/conformance/InstructionConformance.t.sol')
    : vblock('err','EXECUTED','Reverted', r.error||'reverted',
        `The program was executed and the real VM rejected it.`+
        (r.GATE?` Gate token ${r.GATE}.`:''), null,
        'test/conformance/InstructionConformance.t.sol');
  return bar + body;
}

/* One source box: what the contract IS, then the code that matters, then the whole file.
   In that order deliberately — a reader should meet the declaration and the specific
   function before being handed 180 lines, and should still be able to get the 180 lines. */
function srcBox(s){
  const head = s.kind==='solidity'
    ? (s.fn ? `${s.path} — ${s.fn}()  ·  opcode 0x${s.opcode}` : s.path)
    : s.path;
  const c = s.contract || {};
  const about = c.name ? `<div class="about">
      <b class="mono">${esc(c.kind)} ${esc(c.name)}</b>
      ${c.handles && c.handles.length ? ` · also handles ${c.handles.length} opcode${
         c.handles.length===1?'':'s'}: <span class="dimmono">${esc(c.handles.join(', '))}</span>` : ''}
      ${c.doc ? `<div class="natspec">${esc(c.doc)}</div>` : ''}
    </div>` : '';
  const full = (s.full && s.full !== s.text) ? `<details class="innerbox">
      <summary>the whole file — ${s.full_lines} lines</summary>
      <pre class="mono">${esc(s.full)}</pre></details>` : '';
  return `<details class="srcbox"><summary>${esc(head)}</summary>
    <div class="srcbody">${about}
      ${s.kind==='k' && s.focused ? '<div class="lead">The claim — this is the invariant, '+
        'stated. Everything else in the file is imports and module setup.</div>' : ''}
      <pre class="mono">${esc(s.text)}</pre>${full}</div></details>`;
}

function renderSources(e){
  const S = e.sources || {};
  const keys = Object.keys(S);
  if(!keys.length) return '';
  const one = k => srcBox(S[k]);
  const sol = keys.filter(k => S[k].kind==='solidity');
  const ks  = keys.filter(k => S[k].kind==='k');
  return `<section><h4>Read the sources</h4>
    ${sol.length ? `<div class="srchdr">The Solidity each instruction dispatches to —
       taken from <span class="mono">src/opcodes/Opcodes.sol</span>, the table the VM really
       branches on</div>${sol.map(one).join('')}` : ''}
    ${ks.length ? `<div class="srchdr" style="margin-top:14px">The specifications — this is
       where the prose above comes from, and the only place a claim is actually
       stated</div>${ks.map(one).join('')}` : ''}
  </section>`;
}

function renderModel(e){
  if(!e.expect) return '';
  const real = e.exec[gate] || {};
  const m = e.expect;
  const modelRan = m.status && m.status !== 'Reverted';
  const vmRan = real.status === 'completed';
  const agree = modelRan === vmRan;
  return `<section><h4>K model vs the real VM</h4>
    ${vblock(agree?'yes':'warnb', agree?'AGREE':'DIVERGE',
      agree ? 'The model and the VM behave the same way here'
            : 'The model and the VM behave DIFFERENTLY here',
      `Model: ${m.status}${m.pc!=null?`, final pc ${m.pc}`:''}`+
      `${m.amountOut!=null?`, amountOut ${m.amountOut}`:''}  ·  `+
      `VM: ${real.status||'not recorded'}${real.nextPC!=null?`, final pc ${real.nextPC}`:''}`+
      `${real.amountOut!=null?`, amountOut ${real.amountOut}`:''}`,
      agree ? 'The L2 theorems are proved about the model. They say something about '+
              'production only where the two agree, so this is the check that gives them '+
              'their meaning.'
            : 'The model continues where production reverts. Every theorem proved about '+
              'this program in the model therefore says nothing about the deployed VM — '+
              'this is the honest limit of the approach, not a detail.',
      null, 'semantics/swapvm.md')}</section>`;
}

function render(){
  const e = DATA.examples[cur];
  document.getElementById('main').innerHTML = `
    <h3>${esc(e.title)}</h3>
    <div class="note">${esc(e.note)}</div>

    <section><h4>The program</h4>${renderSteps(e)}
      <div class="bytes mono" style="margin-top:9px">${esc(e.bytes)}</div></section>

    ${e.lint.length ? `<section><h4>Flagged</h4>${e.lint.map(l =>
        vblock(l.level==='error'?'err':'warnb', (l.level||'flag').toUpperCase(),
               `pc ${l.pc} — ${l.text}`, '', l.why, null, l.source)
      ).join('')}</section>` : ''}

    <section><h4>Which specifications apply</h4>${
      e.applicable.map(p => p.holds
        ? vblock('info','APPLIES', `${p.id} — this spec covers this program`, p.plain,
                 `${p.because} ${p.why_it_is_strong||''}`, p.assumptions, p.docfile||p.file)
        : vblock('no','N/A', `${p.id} — does not apply`, p.plain, p.because, null,
                 p.docfile||p.file)).join('')
    }</section>

    <section><h4>What kprove returned</h4>${renderProof(e)}</section>
    <section><h4>What the real VM did</h4>${renderExec(e)}</section>
    ${renderModel(e)}
    ${renderSources(e)}`;

  document.querySelectorAll('.gate button').forEach(b =>
    b.onclick = () => { gate = +b.dataset.g; render(); });
  renderNav();
}

document.getElementById('hdr').textContent =
  `${DATA.examples.length} programs · ${DATA.coverage.opcodes_modelled} of `+
  `${DATA.coverage.opcodes_total} `+
  `opcodes modelled in the K semantics · every result below was produced by running the tools`;
document.getElementById('foot').innerHTML =
  `<b>This page is a viewer, not evidence.</b> It is static: the proof and execution results
   were recorded by really running <code>kprove</code> and <code>forge</code>
   (${esc((DATA.recorded_at||'').replace('T',' ').replace('+00:00',' UTC'))}), then frozen.
   Nothing here can be re-run from this page, and nothing here is checked by loading it.
   To check the claims, run them:
   <code>./semantics/run-proofs.sh</code> and <code>../dustproof/semantics/run-proofs.sh</code>
   — see <code>VERIFY.md</code>. The interactive version, where you can compose a program of
   your own and ask about it, needs a Python process: <code>python3 demo/server.py</code>.
   <br><br>Baked ${esc((DATA.baked_at||'').replace('T',' ').replace('+00:00',' UTC'))}.`;
render();
</script></body></html>
