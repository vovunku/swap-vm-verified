[profile.default]
solc_version   = "0.8.30"
optimizer      = true
optimizer_runs = 700
via_ir         = true
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./config" }
]

[fmt]
single_line_statement_blocks = "multi"
multiline_func_header        = "all"
override_spacing             = false
bracket_spacing              = true
int_types                    = "long"
number_underscore            = "thousands"

[profile.ci]
solc_version   = "0.8.30"
optimizer      = true
optimizer_runs = 700
via_ir         = true

# Profile used by Kontrol symbolic execution (`FOUNDRY_PROFILE=kontrol kontrol build`).
# Kept separate from `default` on purpose: `evm_version` is unpinned in `default`, and
# pinning it there would change the emitted bytecode and invalidate `.gas-snapshot`,
# which CI gates on via `yarn snapshot:check`. Proofs, unlike snapshots, must pin the
# EVM version — gas costs and opcode availability are hardfork-dependent, so an
# unpinned version means a proof does not identify which semantics it verified.
# Keep this in sync with the `--schedule` value in kontrol.toml.
[profile.kontrol]
solc_version   = "0.8.30"
optimizer      = true
optimizer_runs = 700
via_ir         = true
evm_version    = "cancun"

# `out` must be set explicitly. Foundry defaults it to "out" internally, but Kontrol reads
# the profile itself and defaults a missing key to the empty string, i.e. the repository
# root (kontrol/foundry.py: `self._root / self.profile.get('out', '')`). Leaving it unset
# scatters `kompiled/`, `digest` and `proofs/` across the repo root, and — because forge
# still writes build-info to `out/build-info` — makes `kontrol show` and `kontrol view-kcfg`
# fail outright with `ValueError: max() arg is an empty sequence`, since they look for
# build-info at the root. Setting it also keeps every Kontrol artifact under the
# already-gitignored `out/`.
out            = "out"
