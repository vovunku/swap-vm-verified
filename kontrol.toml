[build.default]
foundry-project-root       = '.'
regen                      = false
rekompile                  = false
verbose                    = false
debug                      = false
require                    = 'lemmas.k'
module-import              = 'TestBase:SWAPVM-LEMMAS'
auxiliary-lemmas           = true
o2                         = true

[prove.default]
foundry-project-root       = '.'
verbose                    = false
debug                      = false
reinit                     = false
failure-information        = true
counterexample-information = true
minimize-proofs            = false
fail-fast                  = false
run-constructor            = false
no-stack-checks            = true

# 2, not 4. Several agents prove concurrently on a 16-core box and this multiplies with
# `max-frontier-parallel` below: agents x workers x max-frontier-parallel = Haskell threads.
# At 5 agents this was measured at load 27.8 with 73 live backend servers, ~175%
# oversubscribed -- which presents as proofs being "stuck" when they are merely starved.
workers                    = 2

# Pin the hardfork the proof is carried out under. Must match `evm_version` in the
# `kontrol` profile of foundry.toml, otherwise the proof verifies bytecode compiled
# for one schedule against the cost/opcode rules of another.
schedule                   = 'CANCUN'

# ---------------------------------------------------------------------------
# Performance. These values are measured, not guessed -- and they were REVERSED once,
# on evidence. Read the whole block before changing them back.
# ---------------------------------------------------------------------------
#
# THE HISTORY, because the reversal is the important part.
#
# This file once set fine-grained checkpointing (`max-depth = 2000`, `break-on-basic-blocks`,
# `break-on-calls`). A controlled A/B -- two runs per arm, interleaved, on
# XYCSwapSpec.test_exactIn_zeroInputYieldsZeroOutput -- appeared to demolish it:
#
#   proof execution time   785 s / 749 s  ->   87 s /  76 s     9.4x faster
#   wall clock             944 s / 877 s  ->  168 s / 143 s     5.9x faster
#   node ids allocated          89        ->        4
#   proof.json                22.5 MB     ->     0.91 MB        24x smaller
#   final KCFG and verdict    identical   ->   identical (PASSED)
#
# The mechanism was real: cut-point rules make the backend return after every basic block,
# turning one `execute` RPC into ~89, each shipping a 140-250 KB configuration both ways --
# and then `optimize-kcfg` merges those nodes back and DELETES them
# (pyk/kcfg/kcfg.py:589-601), so we paid ~85 round trips for checkpoints that do not survive.
#
# THAT A/B WAS MEASURED ON ONE PROPERTY, AND IT DID NOT GENERALISE.
#
# `test_exactIn_zeroInputYieldsZeroOutput` has edges 1200-3300 steps long: straight, and
# exactly the shape that pays for cut-points without benefiting from them. On a branchy body,
# or on any goal carrying a symbolic product, the result INVERTS -- and it inverts far harder
# than it ever won. Three independent measurements, on two different specs:
#
#   PeggedSwapSpec.test_seam_deadCode_noSolutionIsUnreachable_exactOut, node 39
#       no-checkpoint:  did not expand AT ALL across two ~20-min runs plus a 1217 s run
#       checkpointed:   expanded within three minutes, 31 -> 37 nodes
#
#   PowerSpec.test_unroll_exponentTwo  (ONE symbolic square, ONE symbolic mul-div --
#                                       the smallest non-trivial goal in that file)
#       no-checkpoint:  55 min CPU/worker, ZERO nodes, zero KCFG flushes
#       checkpointed:   20 nodes in ~2 min, then ids 20 -> 31 over ~10 min
#
# So the two arms are not symmetric and must not be traded off as if they were. The cost of
# checkpointing is a bounded slowdown -- 9.4x, on one measured shape. The cost of NOT
# checkpointing is that a proof makes no progress at all, forever, while looking exactly like
# a proof blocked on a missing lemma. That misdiagnosis has burned multiple sessions in this
# project. A bounded slowdown is strictly preferable to an unbounded one that also lies to you.
#
# THEREFORE the checkpointing settings are now the DEFAULT, and the old no-checkpoint values
# live in [prove.fast] below. Use [prove.fast] only for a goal already known to have long
# straight edges and fully concrete arguments -- and if it makes no visible progress within a
# few minutes, switch back rather than waiting.
max-depth                  = 2000
break-on-basic-blocks      = true
break-on-calls             = true
break-on-jumpi             = false
break-on-jump              = false
break-on-storage           = false
break-on-cheatcodes        = false
optimize-kcfg              = false

# `max-frontier-parallel` sets the server's GHCRTS=-N (kontrol/prove.py:359 ->
# pyk/kore/rpc.py:1322). At its default of 1, every kore-rpc-booster process runs with a
# single Haskell capability, so a lone `workers = 4` run uses at most 4 of 16 cores.
#
# BUT it multiplies with concurrency, and that recommendation assumed one prove run at a
# time. With several agents proving at once the arithmetic is
#     agents x workers x max-frontier-parallel  =  Haskell threads
# and at 5 agents x 2 workers x 4 that is ~40 threads on 16 cores. Measured: load average
# 27.8 with 73 live backend servers, i.e. ~175% oversubscribed, which looks exactly like
# proofs being "stuck" when they are only starved.
#
# 2 is the value for a shared machine running several agents. Raise it toward 4 only when
# a single proof has the box to itself.
max-frontier-parallel      = 2

# `log-rewrites` defaults to true, and at `maintenance-rate = 1` the resulting proof.json
# is rewritten every iteration - 150,180 rewrite-log entries and ~1 GB of disk writes for
# a single 4-node proof. Note the key is `log-rewrites = false`; `no-log-rewrites = true`
# silently does nothing.
log-rewrites               = false
maintenance-rate           = 16

# SMT retries use a *scaling* timeout, and the default retry limit is 10. A single
# undecidable query - exactly what a symbolic DIV or a symbolic square produces - burns
# 5s + 10s + 20s + ... before returning Unknown, after which the booster aborts the step
# and Kore re-runs it. That is the mechanism behind "a symbolic DIV stalls forever with
# nothing visibly hung". Upstream kontrol#716 reached the same conclusion.
#
# NECESSARY BUT NOT SUFFICIENT. There is a SECOND stall with the identical symptom, and
# `smt-retry-limit = 0` does nothing for it. Measured on PowerSpec at the wall: the booster
# ran at 100% CPU while its `z3` child accumulated ZERO seconds of CPU over 19 minutes. That
# is not the solver looping, it is Haskell-side simplification looping. The same observation
# was made independently on XYCSwap, where all six outstanding goals were extracted and put
# to z3 directly and every one came back in under 60 ms.
#
# Diagnosis: "the proof is stuck" almost never means "the SMT solver is struggling" in this
# project. Check `z3` child CPU before assuming it does -- if z3 is idle, no solver flag will
# help and the answer is a simplification rule or the checkpointing profile.
#
# A REAL LIMITATION OF THE TRACING TOOL: `--haskell-log-dir` flushes per COMPLETED request,
# so a step that never returns produces no log file at all. The stalls you most want to trace
# are precisely the ones the tracer cannot see. Do not read an empty log dir as "nothing
# happened".
smt-timeout                = 120000
smt-retry-limit            = 0

cse                        = false

# The former default: no checkpointing, one long edge per step. Measured 9.4x faster on
# XYCSwapSpec.test_exactIn_zeroInputYieldsZeroOutput and unable to make ANY progress on
# PowerSpec.test_unroll_exponentTwo or PeggedSwapSpec node 39. See the history block above.
#
# Use ONLY for a goal already known to have long straight edges and concrete arguments. If it
# shows no progress within a few minutes, it is not slow, it is stopped -- switch back.
[prove.fast]
foundry-project-root       = '.'
workers                    = 2
failure-information        = true
counterexample-information = true
fail-fast                  = false
run-constructor            = false
no-stack-checks            = true
schedule                   = 'CANCUN'
max-depth                  = 100000
break-on-basic-blocks      = false
break-on-calls             = false
optimize-kcfg              = true
log-rewrites               = false
maintenance-rate           = 16
smt-timeout                = 120000
smt-retry-limit            = 0

# Compositional symbolic execution. Kept as a SEPARATE profile rather than folded into the
# default, so the first runs against it are a clean A/B rather than a confounded one.
#
# Why it matters here: every spec deploys a harness and calls it EXTERNALLY, so each property
# pays ~1930 steps of ABI-encode, STATICCALL frame setup, ABI-decode and return buffer before
# reaching any instruction arithmetic -- measured on XYCSwapSpec.test_exactIn_cannotDrainPool,
# whose first guard branch is not reached until node 45 of 62, and whose open leaves contain
# no arithmetic term at all. We pay that once per property, thirteen times over in XYCSwap
# alone. CSE executes a called function once in an abstract symbolic setting and installs the
# result as a summary rule applied at higher priority at every later call site.
#
# Upstream documents this as the primary optimisation for external calls; it was `false` here
# for the whole project. It composes with `@custom:kontrol-precondition` NatSpec annotations,
# which apply constraints DURING summary generation and so eliminate overflow branches before
# the summary is built -- which is exactly what blocks the exactness properties.
#
# `--cse` and `--include-summary` are mutually exclusive (kontrol/prove.py:75).
[prove.cse]
foundry-project-root       = '.'
workers                    = 2
failure-information        = true
counterexample-information = true
fail-fast                  = false
run-constructor            = false
no-stack-checks            = true
schedule                   = 'CANCUN'
max-depth                  = 2000
break-on-basic-blocks      = true
break-on-calls             = true
optimize-kcfg              = false
log-rewrites               = false
maintenance-rate           = 16
smt-timeout                = 120000
smt-retry-limit            = 0
cse                        = true

# Profile for diagnosing a single stuck proof: same cut points as the default now uses, but
# `workers = 2` and nothing else competing, so `kontrol show --node` can localise the stall.
# Since the default adopted checkpointing this is close to it -- kept as a stable name for
# briefs and docs that reference it.
[prove.inspect]
foundry-project-root       = '.'
workers                    = 2
failure-information        = true
counterexample-information = true
fail-fast                  = false
run-constructor            = false
no-stack-checks            = true
schedule                   = 'CANCUN'
max-depth                  = 2000
break-on-basic-blocks      = true
break-on-calls             = true
optimize-kcfg              = false
smt-timeout                = 120000
smt-retry-limit            = 0

# ---------------------------------------------------------------------------
# XYCSwap: the reproducible green set, and the honest quarantine beside it.
# ---------------------------------------------------------------------------
#
# Profiles do NOT inherit from [prove.default] -- every setting is repeated, as in the
# profiles above. Both carry `--fallback-on Aborted` via `kore-rpc-command`; see the note
# at the end of this file for why that flag is load-bearing.
#
# NOTE ON `match-test`: it is a REGEX matched with `re.search`, so a bare property name
# also matches its `_boundedTo128Bits` twin. Full signatures are used to disambiguate --
# the twins take `uint128` and the full-width forms take `uint256`.

[prove.xycswap]
foundry-project-root       = '.'
workers                    = 2
max-frontier-parallel      = 2
failure-information        = true
counterexample-information = true
fail-fast                  = false
run-constructor            = false
no-stack-checks            = true
schedule                   = 'CANCUN'
max-depth                  = 2000
break-on-basic-blocks      = true
break-on-calls             = true
optimize-kcfg              = false
log-rewrites               = false
maintenance-rate           = 16
smt-timeout                = 120000
smt-retry-limit            = 0
kore-rpc-command           = 'kore-rpc-booster --no-post-exec-simplify --equation-max-recursion 100 --equation-max-iterations 1000 --fallback-on Aborted'
match-test = [
  # -- concrete witnesses (non-vacuity anchors for everything below) --
  'XYCSwapSpec.test_exactIn_quoteIsReachable_witness()',
  'XYCSwapSpec.test_exactOut_quoteIsReachable_witness()',
  # -- guards --
  'XYCSwapSpec.test_exactIn_revertsOnZeroBalanceIn(uint256,uint256)',
  'XYCSwapSpec.test_exactIn_revertsOnZeroBalanceOut(uint256,uint256)',
  'XYCSwapSpec.test_exactIn_revertsWhenAmountOutAlreadySet(uint256,uint256,uint256,uint256)',
  # -- boundaries --
  'XYCSwapSpec.test_exactIn_zeroInputYieldsZeroOutput(uint256,uint256)',
  'XYCSwapSpec.test_exactOut_zeroOutputCostsNothing(uint256,uint256)',
  # -- arithmetic that closes at full width --
  'XYCSwapSpec.test_exactOut_roundsInFavourOfMaker(uint256,uint256,uint256)',
  'XYCSwapSpec.test_exactIn_constantProductNeverDecreases(uint256,uint256,uint256)',
  # -- the four narrowed twins (see the quarantine profile below) --
  'XYCSwapSpec.test_exactIn_cannotDrainPool_boundedTo128Bits(uint128,uint128,uint128)',
  'XYCSwapSpec.test_exactIn_roundsInFavourOfMaker_boundedTo128Bits(uint128,uint128,uint128)',
  'XYCSwapSpec.test_exactIn_isExactlyTheFloor_boundedTo128Bits(uint128,uint128,uint128)',
  'XYCSwapSpec.test_exactOut_isExactlyTheCeiling_boundedTo128Bits(uint128,uint128,uint128)',
]

# The four that do NOT close. Kept runnable rather than deleted or commented out, so a
# future attempt is a one-liner and the gap stays visible.
#
# WHAT IS WRONG WITH THEM. All four are stated over full `uint256` with `try`/`catch`.
# Each has a `_boundedTo128Bits` twin in [prove.xycswap] which is the SAME property with
# 128-bit operands. Measured on this tree:
#
#     all four narrowed twins   ->  115 s total  (7 s, 8 s, 45 s, 55 s)
#     the four full-width forms ->  >40 min across four prover configurations
#                                   plus a rebuild; none closed
#
# The cause is the assertion terms, not the curve. At full width the exact-out statement
# forms `(ceilDiv(n, d) - 1) * d` -- a symbolic division multiplied back by its own divisor,
# under `chop`, compared against a symbolic product. Below 2**128 every product is
# representable, `chop` disappears, and the overflow branches go with it.
#
# RULED OUT BY MEASUREMENT, so nobody repeats the search:
#   * SMT           -- the goals were extracted to QF_NIA and z3 decided them in <60 ms
#   * equation limits -- raised 5 -> 100 in the booster, no change
#   * this repo's lemmas.k -- rebuilt with SWAPVM-LEMMAS removed entirely, hang reproduced
#   * under-expansion -- reproduced across three runs and two proof versions
#   * CSE           -- ran once the harness dropped its `bytes` parameter; no movement
#
# `--fallback-on Aborted` DOES move them (68 -> 151 nodes where nothing moved before) but
# they plateau again deeper in. That flag is the single most useful lever found so far.
[prove.xycswap-open]
foundry-project-root       = '.'
workers                    = 2
max-frontier-parallel      = 2
failure-information        = true
counterexample-information = true
fail-fast                  = false
run-constructor            = false
no-stack-checks            = true
schedule                   = 'CANCUN'
max-depth                  = 2000
break-on-basic-blocks      = true
break-on-calls             = true
optimize-kcfg              = false
log-rewrites               = false
maintenance-rate           = 16
smt-timeout                = 120000
smt-retry-limit            = 0
kore-rpc-command           = 'kore-rpc-booster --no-post-exec-simplify --equation-max-recursion 100 --equation-max-iterations 1000 --fallback-on Aborted'
match-test = [
  'XYCSwapSpec.test_exactIn_cannotDrainPool(uint256,uint256,uint256)',
  'XYCSwapSpec.test_exactIn_roundsInFavourOfMaker(uint256,uint256,uint256)',
  'XYCSwapSpec.test_exactIn_isExactlyTheFloor(uint256,uint256,uint256)',
  'XYCSwapSpec.test_exactOut_isExactlyTheCeiling(uint256,uint256,uint256)',
]

[show.default]
foundry-project-root       = '.'
verbose                    = false
debug                      = false
use-hex-encoding           = false

[view-kcfg.default]
foundry-project-root       = '.'
use-hex-encoding           = false

# ---------------------------------------------------------------------------
# `--fallback-on Aborted`: what it does, and why it is not in [prove.default]
# ---------------------------------------------------------------------------
#
# Kontrol talks to a PROXY in front of two backends: `kore-rpc-booster` (fast, LLVM-backed,
# INCOMPLETE) and `kore-rpc` ("Kore", slow, complete). When the booster cannot finish a step
# it gives up with a reason -- `Aborted`, `Stuck` or `Branching`. The proxy has a list of
# reasons that trigger FALLBACK: simplify the whole state and re-execute the step in Kore.
# From `booster/tools/booster/Proxy.hs`, the default list is ALL THREE:
#
#     -- if we stop for a reason in fallbackReasons (default [Aborted, Stuck, Branching],
#     -- revert to the old backend to re-confirm and possibly proceed.
#
# `--fallback-on Aborted` shortens that list to one entry, so `Stuck` and `Branching` no
# longer punt to Kore.
#
# WHY IT MATTERS HERE. Measured on `XYCSwapSpec.test_exactOut_isExactlyTheCeiling`: six
# `execute` RPCs are issued, the first five return in milliseconds, and the sixth NEVER
# RETURNS -- 8m23s with zero nodes produced, reproduced across three runs and two proof
# versions. Booster-level logging shows that step running in the `[kore]` context with
# ~14.6 MILLION nested `[constraint]` simplifications against only ~6,000 successful rule
# applications. The work is side-condition checking that never converges, in the LEGACY
# backend, reached by fallback. With the flag, that goal advanced 68 -> 151 nodes.
#
# This is why the obvious knobs did nothing: `--equation-max-recursion` and
# `--equation-max-iterations` tune the BOOSTER, and the booster was not where the time went.
#
# THE TRADE, WHICH IS REAL. The booster is less complete than Kore, so declining the
# `Stuck`/`Branching` fallback can leave a node genuinely stuck that Kore would have
# advanced. Optimism keeps the default all-three; Lido uses exactly `--fallback-on Aborted`.
# It is kept OUT of [prove.default] for that reason -- opt in per profile, deliberately.
# A stuck node is at least visible; the hang tells you nothing.
#
# DIAGNOSING A HANG. `ls out/proofs/<id>/kcfg/nodes | wc -l` over time is a LIVE progress
# signal -- nodes are written as they are computed, independently of the `proof.json` flush
# (which `maintenance-rate = 16` makes rare). Do not infer progress from a quiet log, and do
# not infer "SMT is struggling" without checking the `z3` child's CPU first.
